# Devcontainer services (integration, userns, toolchain) under an unprivileged posture: no capabilities, read-only root, no network, finite memlock (16 MiB) and core (1 MiB) limits the suite asserts.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024
  mem_limit: 4g
  memswap_limit: 4g
  cpus: 4
  ulimits:
    memlock:
      soft: 16777216
      hard: 16777216
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 4096
      hard: 4096
  working_dir: /src

x-integration: &integration_service
  <<: *posture
  # The content-named image scripts/integration-image.sh builds and scans; this default is for a hand-run compose only.
  image: ${GO_ENCLAVE_IT_IMAGE:-go-enclave-it:local}
  build:
    context: ../../..
    dockerfile: build/docker/devcontainer/Dockerfile
    target: integration
    # The Alpine package index checksum the image tag hashes; empty outside CI.
    args:
      APK_INDEX_SUM: ${APK_INDEX_SUM:-}
  user: "10001:10001"
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
  volumes:
    - gocache:/gocache
  environment:
    GOTOOLCHAIN: local
    GOFLAGS: -mod=readonly
    GOPROXY: "off"
    # FIPS settings; make integration-test-fips overrides all three and the suite asserts they match the runtime.
    GOFIPS140: "off"
    GO_ENCLAVE_IT_FIPS_MODE: "off"
    # Must equal ulimits.memlock above (see there).
    GO_ENCLAVE_IT_MEMLOCK_BYTES: "16777216"
    GO_ENCLAVE_IT_CORE_BYTES: "1048576"

services:
  integration:
    <<: *integration_service

  # The user-namespace test, under Docker's default seccomp profile changed only to permit CLONE_NEWUSER.
  userns:
    <<: *integration_service
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-userns.json

  toolchain:
    <<: *posture
    image: go-enclave-toolchain:${GO_ENCLAVE_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${GO_ENCLAVE_UID:-10001}:${GO_ENCLAVE_GID:-10001}"
    # Lint and the race-instrumented tests keep their build artifacts and
    # golangci-lint's cache (HOME=/tmp) here: more room than one suite needs.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777
    volumes:
      - ../../..:/src
      - toolchain-gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      HOME: /tmp

volumes:
  gocache:
  toolchain-gocache:
