# Automated Codex peer review for pull requests.
# Self-hosted only by design: the job guards itself off github.com, because
# the reviewer needs credentials that exist only on the private runners.
#
# The `codex` runs-on label routes this job to the dedicated review runners
# whose job image bakes the review CLI and the
# review assets, and whose config mounts the host's logged-in ~/.codex OAuth
# session. ONLY this workflow may declare `runs-on: codex` — that label
# carries the credential mount.

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Codex Review
    runs-on: codex
    if: github.server_url != 'https://github.com'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The review image bakes the codex CLI but NO Go toolchain, so without
      # this step the reviewer is static-only: it reviews Go code it cannot
      # build or test — every review then reports that tests could not be
      # executed. Installing it in
      # the job keeps the reviewer correct whatever the runner image was
      # built with, and survives a future image rebuild that omits Go again.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'  # track ci.yml GO_VERSION

      - name: Run Codex peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: /opt/codex-review/pr-review.sh
