# Release for go-enclave, on every pushed `v*` tag (#89, release-versioning §5).
#
# `make release`, `make release-candidate` or `make release-alpha` assembles the CHANGELOG, writes
# VERSION, commits, tags and pushes the tag; the tag is vX.Y.Z, vX.Y.Z-alpha or
# vX.Y.Z-rc.N. Everything after that is here, and nothing is created by
# hand on the forge:
#
#   1. Verify   — the tag agrees with its own tree (VERSION, the CHANGELOG
#                 section, no unassembled fragment) and names a commit on main.
#   2. Gate     — the full gate on the TAGGED commit, through the same make
#                 aggregates as ci.yml (ci-lint, ci-build, ci-security,
#                 ci-test, and ci-integration with both FIPS configurations),
#                 plus `make trivy` as a blocking gate and the unit tests under
#                 FIPS 140-3 strict mode.
#                 Trivy is nightly-only for merges in the alpha phase (devops
#                 §8a), but a release is a publication, and §8a allows keeping
#                 it blocking where it is green.
#   3. Consumer — a throwaway module OUTSIDE the repository, with GOWORK=off,
#                 `go get`s the module at this tag, then builds and runs a
#                 program that allocates and destroys an enclave
#                 (release-versioning §2: in-repo builds resolve through the
#                 working tree and never exercise what a consumer gets).
#   4. Publish  — the forge release, with the version's CHANGELOG section as
#                 its body, a prerelease when the tag is `-alpha` or `-rc.N`. Gitea only.
#
# Every check is a make target (release-verify, the gate aggregates,
# consumer-check, release-publish), so each stage reproduces from a shell with
# the same `make` line. What stays here is orchestration: reading the tag from
# the event (build/ci/release-tag.sh), asserting the runner injected forge
# resolution (build/ci/forge-resolution.sh), and refusing to publish unless
# every stage succeeded (build/ci/summary.sh).
#
# Every job runs on the bare runner with actions/setup-go at the version go.mod
# declares, as in ci.yml (see its header for where the pinned tools come from
# and why TOOL_INSTALL is 1 only on github.com). Integration runs the hardened
# integration image through compose.
#
# PUBLICATION ON GITHUB IS NEVER AUTOMATIC. This file is byte-identical on the
# public mirror, where a tag arrives only when the owner pushes one; there the
# verify, gate and consumer jobs still run, and the publish job is skipped.
# Publishing a GitHub release is a publication needing the owner's explicit,
# per-instance approval (release-versioning §5, devops §3) — the publish
# script also refuses api.github.com on its own.
#
# Every job checks out the tag ref, so every job runs on the tagged commit;
# Publish additionally confirms the forge's tag still names the commit Verify
# saw before attaching anything to it.
#
# NEVER add `GOPROXY: direct` or `GOSUMDB: off` here either (see ci.yml). The
# consumer resolves exactly as dependency-resolution §1/§6 says: on our runners
# act_runner injects GOPRIVATE and a read-token insteadOf rewrite into every
# job, so this file sets neither.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # 0 on our runners: require the image's baked tools at the pins, install
  # nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0      # main's history, for the ancestry check below

      - name: Identify the tag
        id: tag
        run: sh build/ci/release-tag.sh

      # VERSION equals the tag unprefixed, CHANGELOG.md has exactly one
      # non-empty section for it, no fragment is waiting in changelog.d/,
      # [Unreleased] is empty — the check the release targets run before they
      # commit — and the tagged commit is on main: every release kind is a
      # tag on main (release-versioning §1a), and a tag on a branch commit
      # would release code main never received.
      #
      # Values reach make ONLY through the environment, never as make
      # command-line assignments: make expands a command-line value when it
      # exports it, and the Makefile reads these as data (see EXTERNAL_VARS).
      - name: Tag agrees with VERSION and CHANGELOG.md, and is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAIN_REF: FETCH_HEAD
        run: |
          set -eu
          git fetch --no-tags --quiet origin main
          make release-verify

  lint:
    name: Lint
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-lint

  build:
    name: Build
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-build

  # ci.yml's Security job plus `trivy fs` (CRITICAL/HIGH) as a blocking gate,
  # with the memory bound ci.yml's Security job documents; same reasons.
  security:
    name: Security
    needs: [verify, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-security trivy

  # ci.yml's Test job plus the unit tests under FIPS 140-3 strict mode.
  test:
    name: Test
    needs: [verify, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-test test-fips

  # The integration suite (#91), both FIPS configurations, in the hardened
  # integration image on the TAGGED commit — the same target ci.yml's
  # Integration job runs, so a tag is held to at least the PR gate. Docker is a
  # hard requirement: the targets fail, never skip, without docker, Compose v2
  # or a reachable daemon. No event value reaches these targets; they take
  # none. Each run trivy-scans the image it builds, and trivy is not on the
  # runner host, so it is installed from the pinned release tarball, verified
  # against scripts/tool-pins.sh's SHA-256 (TOOL_INSTALL=1).
  integration:
    name: Integration
    needs: [verify, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOOL_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-integration

  consumer:
    name: Consumer
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Forge resolution is configured (Gitea)
        if: github.server_url != 'https://github.com'
        run: sh build/ci/forge-resolution.sh

      - name: Build and run a throwaway consumer of the tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: make consumer-check

  publish:
    name: Publish release
    needs: [verify, lint, build, security, test, integration, consumer]
    # always(): so a failed or skipped stage produces a red, named publish job
    # below rather than a silently skipped one. The server guard keeps the
    # public mirror from ever publishing on its own.
    if: always() && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create/update the release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Gitea combines a skipped job as success and does not implement
      # join(needs.*.result) (devops §1), so every stage is checked by name and
      # anything but success refuses to publish.
      - name: Every stage passed
        run: |
          sh build/ci/summary.sh "not publishing: a release stage did not pass" \
            verify="${{ needs.verify.result }}" \
            lint="${{ needs.lint.result }}" \
            build="${{ needs.build.result }}" \
            security="${{ needs.security.result }}" \
            test="${{ needs.test.result }}" \
            integration="${{ needs.integration.result }}" \
            consumer="${{ needs.consumer.result }}"

      - name: Publish the release with its CHANGELOG section
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh build/ci/publish-release.sh
