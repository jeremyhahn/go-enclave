# Release for go-enclave, on every pushed `v*` tag (#89, release-versioning §5).
#
# `make release`, `make release-candidate` or `make release-alpha` assembles the CHANGELOG, writes
# VERSION, commits, tags and pushes the tag; the tag is vX.Y.Z, vX.Y.Z-alpha or
# vX.Y.Z-rc.N. Everything after that is here, and nothing is created by
# hand on the forge:
#
#   1. Verify   — the tag agrees with its own tree (VERSION, the CHANGELOG
#                 section, no unassembled fragment) and names a commit on main.
#   2. Gate     — the full gate on the TAGGED commit, in the toolchain image,
#                 through the make aggregates (ci-lint, ci-build, ci-security,
#                 ci-test, and ci-integration with both FIPS configurations),
#                 plus `make trivy` as a blocking gate and the unit tests under
#                 FIPS 140-3 strict mode.
#                 Trivy is nightly-only for merges in the alpha phase (devops
#                 §8a), but a release is a publication, and §8a allows keeping
#                 it blocking where it is green.
#   3. Consumer — a throwaway module OUTSIDE the repository, with GOWORK=off,
#                 `go get`s the module at this tag, then builds and runs a
#                 program that allocates and destroys an enclave
#                 (release-versioning §2: in-repo builds resolve through the
#                 working tree and never exercise what a consumer gets).
#   4. Publish  — the forge release, with the version's CHANGELOG section as
#                 its body, a prerelease when the tag is `-alpha` or `-rc.N`. Gitea only.
#
# Every check is a make target (release-verify, the gate aggregates,
# consumer-check, release-publish), so each stage reproduces from a shell with
# the same `make` line. What stays here is orchestration: reading the tag from
# the event (build/ci/release-tag.sh), asserting the runner injected forge
# resolution (build/ci/forge-resolution.sh), and refusing to publish unless
# every stage succeeded (build/ci/summary.sh).
#
# The gate runs in the devcontainer's toolchain image, built from the tagged
# commit as ci.yml's image job builds it (`make docker-build`, then each stage
# through scripts/in-toolchain-image.sh), so a release is gated with its own
# tree's Go toolchain and tool pins, never the runner's: a Go bump needs no
# runner rebuild (#244). Integration runs the hardened integration image
# through compose, as ci.yml's Integration job does. Only Consumer runs on the
# bare runner, with actions/setup-go at the version go.mod declares: it builds
# what a consumer gets.
#
# PUBLICATION ON GITHUB IS NEVER AUTOMATIC. This file is byte-identical on the
# public mirror, where a tag arrives only when the owner pushes one; there the
# verify, gate and consumer jobs still run, and the publish job is skipped.
# Publishing a GitHub release is a publication needing the owner's explicit,
# per-instance approval (release-versioning §5, devops §3) — the publish
# script also refuses api.github.com on its own.
#
# Verify resolves the tag to a commit once; every other job checks out that
# SHA (needs.verify.outputs.sha), never the tag ref again, so a tag moved after
# Verify cannot change what the gates run on. Publish additionally confirms the
# forge's tag still names that commit and sends it as the release's
# target_commitish, before attaching anything to it.
#
# NEVER add `GOPROXY: direct` or `GOSUMDB: off` here either (see ci.yml). The
# consumer resolves exactly as dependency-resolution §1/§6 says: on our runners
# act_runner injects GOPRIVATE and a read-token insteadOf rewrite into every
# job, so this file sets neither.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # 0 on our runners: require the image's baked tools at the pins, install
  # nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0      # main's history, for the ancestry check below

      - name: Identify the tag
        id: tag
        run: sh build/ci/release-tag.sh

      # VERSION equals the tag unprefixed, CHANGELOG.md has exactly one
      # non-empty section for it, no fragment is waiting in changelog.d/,
      # [Unreleased] is empty — the check the release targets run before they
      # commit — and the tagged commit is on main: every release kind is a
      # tag on main (release-versioning §1a), and a tag on a branch commit
      # would release code main never received.
      #
      # Values reach make ONLY through the environment, never as make
      # command-line assignments: make expands a command-line value when it
      # exports it, and the Makefile reads these as data (see EXTERNAL_VARS).
      - name: Tag agrees with VERSION and CHANGELOG.md, and is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAIN_REF: FETCH_HEAD
        run: |
          set -eu
          git fetch --no-tags --quiet origin main
          make release-verify

  # The gate in the toolchain image built from the tagged commit, as ci.yml's
  # image job runs its stages (that job's steps, one stage after another):
  # ci-lint, ci-build, ci-security plus `trivy fs` (CRITICAL/HIGH) as a
  # blocking gate, and ci-test plus the unit tests under FIPS 140-3 strict
  # mode. The stages run with no network on the image's module cache, but
  # security, which fetches the vulnerability databases (IN_IMAGE_NETWORK=
  # bridge). Each stage runs even when an earlier one failed, so one run
  # reports every red stage; any red stage fails the job.
  gate:
    name: Gate [toolchain image] [lint, build, security, test]
    needs: [verify]
    runs-on: bigdisk
    timeout-minutes: 120
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # The cache volumes' trust class (ci-standard.md §6): a release tag is on
      # main (Verify checks it), so it reads and writes main's set.
      CI_CACHE_CLASS: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}   # the commit Verify saw, never the tag again

      # Mask the forge credentials before any other step (as in ci.yml).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Build the devcontainer images
        env:
          GO_BUILD_PROXY: ${{ vars.GO_BUILD_PROXY }}
        run: |
          make docker-build GO_BUILD_PROXY="$GO_BUILD_PROXY" IT_IMAGE="$IT_IMAGE"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make ci-lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-lint

      - name: make ci-build
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-build

      - name: make ci-security trivy
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-security trivy

      - name: make ci-test test-fips
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-test test-fips

  # The integration suite (#91), both FIPS configurations, in the hardened
  # integration image on the TAGGED commit, as ci.yml's Integration job runs
  # it, so a tag is held to at least the main gate: the user-namespace test,
  # the default run and the FIPS 140-3 strict run, on the content-addressed
  # image this job names and leases, which scripts/integration-image.sh builds
  # when the runner lacks it and trivy-scans once. Docker is a hard
  # requirement: the targets fail, never skip, without docker, Compose v2 or a
  # reachable daemon. No event value reaches these targets; they take none.
  # trivy is not on the runner host, so it is copied out of the toolchain
  # image, which carries it at the pin in scripts/tool-pins.sh; nothing is
  # downloaded. go-enclave needs no module credential, so no credential file
  # is written.
  integration:
    name: Integration [integration image]
    needs: [verify, gate]
    runs-on: bigdisk
    timeout-minutes: 60
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}   # the commit Verify saw, never the tag again

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # The suites' own compose projects (go-enclave-it-*, go-enclave-userns-*)
      # are reaped beside the repo's CI prefix (as in ci.yml).
      - name: Reap stale CI stacks
        run: |
          scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"
          scripts/reap-stale-ci-stacks.sh go-enclave-it
          scripts/reap-stale-ci-stacks.sh go-enclave-userns-

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # A lease on the integration image, so another run's reap step cannot
      # remove it while this job needs it (ci.yml's Integration job documents
      # the lease: bounded, building the image once if it is missing, and
      # exporting the leased id as IT_LEASE_ID).
      - name: Lease the integration image
        env:
          GO_BUILD_PROXY: ${{ vars.GO_BUILD_PROXY }}
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          if ! take_lease; then
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            rc=0
            make docker-build GO_BUILD_PROXY="$GO_BUILD_PROXY" IT_IMAGE="$IT_IMAGE" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      - name: Pinned trivy from the toolchain image
        run: |
          set -eu
          sh build/ci/toolchain-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make ci-integration (integration image)
        run: |
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          make ci-integration IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE"

      - name: Tear down
        if: always()
        run: |
          IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  consumer:
    name: Consumer
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}   # the commit Verify saw, never the tag again

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Forge resolution is configured (Gitea)
        if: github.server_url != 'https://github.com'
        run: sh build/ci/forge-resolution.sh

      - name: Build and run a throwaway consumer of the tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: make consumer-check

  publish:
    name: Publish release
    needs: [verify, gate, integration, consumer]
    # always(): so a failed or skipped stage produces a red, named publish job
    # below rather than a silently skipped one. The server guard keeps the
    # public mirror from ever publishing on its own.
    if: always() && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create/update the release; nothing else
    steps:
      # Nothing from the repository runs, and no checkout happens, until every
      # stage has passed: with always() this job also starts after a failed
      # Verify, when the SHA may name unverified tag code or be empty (checkout
      # then defaults to the event ref). Gitea combines a skipped job as success
      # and does not implement join(needs.*.result) (devops §1), so every stage
      # is checked by name, inline, and anything but success refuses to publish.
      - name: Every stage passed
        run: |
          bad=0
          for r in \
            verify=${{ needs.verify.result }} \
            gate=${{ needs.gate.result }} \
            integration=${{ needs.integration.result }} \
            consumer=${{ needs.consumer.result }}
          do
            case $r in *=success) ;; *) echo "::error::not publishing: ${r%%=*} is ${r#*=}"; bad=1 ;; esac
          done
          [ "$bad" -eq 0 ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}   # the commit Verify saw, never the tag again
          persist-credentials: false             # publishing uses the step-scoped FORGE_TOKEN

      - name: Publish the release with its CHANGELOG section
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh build/ci/publish-release.sh
