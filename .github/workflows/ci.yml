# ci-template: v1.52 — canonical CI for all first-party Go repos.
# v1.52 (2026-11-21, defect fix): a fork's pull request
# under pull_request reached a self-hosted runner. preflight's runs-on had
# no fork check, so on github.com it took the Dells' bigdisk pool for a
# fork's head, and `Hosted or overflow runner (ruling 1024)` could overflow
# every other job of that run to the Dells. A pull request whose head
# repository is not this repository, a deleted fork included, now runs
# every job on ubuntu-latest: preflight's runs-on adds the clause
# `(!startsWith(github.event_name, 'pull_request') ||
# github.event.pull_request.head.repo.full_name == github.repository)`
# before the variable, so a fork takes `ubuntu-latest` whatever
# CI_PREFLIGHT_RUNS_ON holds, and the selection step outputs the hosted
# default for a fork's head with a ::notice and no API call. `Runner labels`
# gives a fork's head under pull_request, as under
# pull_request_target since v1.51, no unset-variable exemption, and reads
# the selection outputs for it at their hosted default, as the step emits.
# Same-repository pull requests, pushes and Gitea are unchanged.
# testdata/runner-labels-tests.py part H and testdata/runner-select-tests.py
# part E hold the cases. Adopt as a one-file bump that keeps the CUSTOMIZE
# blocks.
# v1.51 (2026-11-21, hardening): `Runner labels (ruling 633)`
# also checks every runs-on under pull_request_target, same-repository and
# fork. code-review.yml and signatures.yml run on that base-defined event, so
# a runs-on that picks a self-hosted label only there was never read. In a
# workflow with that trigger a fork's head gets no overflow and no
# unset-variable exemption: a fork never reaches a self-hosted runner, and
# its finding says so. testdata/runner-labels-tests.py part G holds the
# cases. No other change.
# v1.50 (2026-11-21, "hosted first with overflow to the
# self-hosted pool", defect fix): the overflow never fired under load. The Actions
# API's runs?status=queued listing returns fewer items than its total_count
# while runs change state (go-trusted-platform preflights 01:15Z-01:40Z on
# 11-21: "61 of 62 entries", "57 of 59"; go-quicbaas 02:23Z: "30 of 31"),
# and `Hosted or overflow runner (ruling 1024)` treated every short list as
# an unread count and picked hosted, so the longer the hosted queue, the
# surer the hosted pick. A short list is now a lower bound: the counts can
# only be under, never over, so a lower bound at or past
# HOSTED_JOBS_PER_REPO, or a hosted job of another run queued past the
# grace in it, overflows as before. A short list that does not reach either
# trigger still picks hosted with a ::warning naming the shortfall. A reply
# that is not 200, a missing total_count or list, a threshold that is not a
# number, and more than 1000 entries still pick hosted with a warning.
# testdata/runner-select-tests.py C4 and B7 hold the cases. Adopt as a
# one-file bump that keeps the CUSTOMIZE blocks.
# v1.49 (2026-11-20, CI priority 1,
# defect fix): the preflight job ran on ubuntu-latest on github.com, about
# ten seconds of work, and with the 40 hosted runners full and about 320
# jobs queued it waited up to an hour; every other job needs it, so the
# self-hosted jobs waited behind it. v1.48's runner choice runs inside
# preflight and cannot help it, since runs-on is read before any job runs.
# On github.com preflight's runs-on is now
# `fromJSON(vars.CI_PREFLIGHT_RUNS_ON || '["self-hosted","linux","x64","bigdisk"]')`:
# the Dells' bigdisk pool, which the overflow already uses. The repository
# variable CI_PREFLIGHT_RUNS_ON, runs-on JSON, is the fallback switch: an
# operator sets it to `"ubuntu-latest"` (quotes included; a value that is not
# JSON fails the run) while the Dells are down. Off github.com it keeps
# `ubuntu-latest`, the forge label, as before. preflight sets up no Go and
# touches no Actions cache (v1.36), builds nothing and prints no runner
# address (v1.44, v1.45), and checks out with persist-credentials false; its
# steps read the PR's tree as text and run none of it. The schedule guard's
# AGENT_TOKEN is now passed off github.com only: on github.com the guard
# never read it (no schedule check, no tree proof there), so the secret no
# longer reaches the Dells' runner. `Runner labels (ruling 633)` checks
# preflight's runs-on, and only that job's, with the variable unset (exactly
# [self-hosted, linux, x64, bigdisk] passes too) and set to the fallback (a
# standard image on every event); testdata/runner-labels-tests.py part F
# holds the cases. preflight now holds a bigdisk slot for its ten seconds,
# and the pool needs jq, curl, git and python3 on its runner. Adopt as a
# one-file bump that keeps the CUSTOMIZE blocks.
# v1.48 (2026-11-20, owner
# decision: the self-hosted runners supplement the 40 GitHub-hosted
# runners; hosted stays the default, and when the hosted pool is full a job
# runs on the Dells instead of queueing): a new preflight step, `Hosted or
# overflow runner (ruling 1024)`, counts this repository's jobs on
# GitHub-hosted runners (labels ubuntu-*, not self-hosted) in every queued
# and in-progress run, through the Actions API with the job token (actions:
# read; no new permission). It outputs `runner` and `runner_docker` as
# runs-on JSON: `"ubuntu-latest"` by default, and
# `["self-hosted","linux","x64","bigdisk"]` and `[...,"bigdisk-docker"]`
# when HOSTED_JOBS_PER_REPO (12, a new top-level env) or more hosted jobs of
# the repository are in progress, or a hosted job of another run has been
# queued HOSTED_QUEUE_GRACE_SECONDS (60) or more. The labels are the ones the
# self-hosted pools already register per repository. lint, image, lint-gates,
# integration and soak build or run images on a Docker daemon, so their
# runs-on reads runner_docker; CI Gate needs no daemon and reads runner
# (guarded with `|| '"ubuntu-latest"'`, since it also runs when preflight
# was skipped or failed, and then fails on its own). Each of them already
# needs preflight and keeps the self-hosted rules of v1.36, v1.44 and v1.45
# (no Actions cache, the LAN mask, the image history check): they run on
# bigdisk on the forge today. No fallback hides a failure, and the choice on
# error is hosted with a visible warning: when the counts cannot be read (a
# reply that is not 200, a list short of its total_count, a missing field,
# a threshold that is not a number), the step picks the hosted default and
# prints a ::warning that names why; it never sends a run to the Dells on
# an unread count. Off github.com it makes no call and each job keeps its
# forge label (bigdisk, ci-gate), as in v1.47. The preflight step `Runner
# labels (ruling 633)` accepts, in ci.yml only, a runs-on that reads exactly
# needs.preflight.outputs.runner or runner_docker: it evaluates the output at
# its default, which must give a standard image as finding (c) asks, and at
# its overflow, where exactly the matching bigdisk or bigdisk-docker list
# passes too. A self-hosted label any other way still needs its waiver.
# testdata/runner-select-tests.py runs the new step against a fake API, and
# testdata/runner-labels-tests.py part E holds the lint's cases. A
# repository adopts v1.48 as a one-file bump that keeps its CUSTOMIZE
# blocks; a CUSTOMIZE job that builds images may read runner_docker the same
# way, and one that adds `Free runner disk` runs it only when
# `runner.environment == 'github-hosted'`.
# v1.47 (2026-11-20; a Codex review
# found that the v1.46 gate let `runs-on: codex  # self-hosted: hardware: ...`
# through on the waiver alone): the step `Runner labels (ruling 633)` checks
# the label and the category together. The review-only labels, `codex` and
# `qwen`, are reserved to code-review.yml whatever the waiver says: a job in
# any other workflow that names one, in its runs-on text or in what an
# expression there yields, is finding (f). In code-review.yml, `codex` takes
# only `credential:` and `qwen` only `hardware:`, and `credential:` is
# accepted only on the `codex` job; any other pairing is (f). Nothing else
# changes, and a repository that copied v1.46 unchanged passes v1.47.
# v1.46 (2026-11-20, owner decision: GitHub-hosted
# standard runners for every CI job possible; self-hosted only for
# hardware-specific or oversize jobs, the reason recorded per job): the
# preflight step `Runner labels (ruling 633)` accepts a self-hosted runs-on
# on github.com only when its line names the category of its reason,
# `# self-hosted: hardware: <reason>` (a device, a GPU, a dedicated host or
# VM pool the job needs) or `# self-hosted: oversize: <reason>` (more than a
# standard runner's 4 vCPU, 16 GB, about 45 GB of disk after `Free runner
# disk`, or 6 hours). `# self-hosted: credential: <reason>` is accepted for
# the one job that holds a credential kept on one host (code-review.yml's
# Codex review), pending a decision. A v1.43
# reason with no category is now finding (e). A `release` job is the release
# rule's, unchanged. Every template job passes: batch.yml v1.3 and fuzz.yml
# v2 move to ubuntu-latest, code-review.yml v5.12.4 names its categories. A
# repository adopts v1.46 in ONE PR: each job that fits a standard runner
# moves to `ubuntu-latest` (keeping `Free runner disk` before an image
# build), and each job that stays self-hosted names its category and reason.
# v1.45 (2026-11-18): every job that builds an image
# (lint, lint-gates, image, integration, soak) runs scripts/ci-image-history.sh
# on the images it will use, after its last build step and before its first
# use, on a pool runner: a pool build passes the LAN caches as BuildKit
# secrets, which no history entry keeps, and the check fails on any private
# address in an image's history or config. publish-images checks through
# ci-image-cache.sh v4 before the push, and masks the LAN addresses
# (v1.44). Copy scripts/ci-image-history.sh (`chmod +x`); testdata/
# ci-image-history-tests.py holds the steps' places and publish's order.
# v1.44 (2026-11-18; the owner's rule that internal
# addresses stay out of public repositories, and their CI logs count): every
# job that builds runs scripts/ci-mask-lan.sh right after the credential
# mask. A pool runner's environment names LAN addresses (the DEVCACHE_*
# package caches, GOPROXY's module proxy, the LAN CI registry); a BuildKit
# build echoes its build arguments and `go env` prints GOPROXY. The script
# prints ::add-mask:: for each private-address entry, its host:port and its
# host, so the runner masks them in every later line; on a GitHub-hosted
# runner the variables are unset and it prints nothing. A job a repository
# routes to a pool is therefore masked from its first build on. Copy the
# script to scripts/ci-mask-lan.sh (`chmod +x`); testdata/ci-mask-lan-tests.py
# holds the script and the step's place.
# v1.43 (2026-11-17; the owner's 11-07 decision that
# GitHub-hosted runners are the default, hosted-first phase 1):
# a job runs on a standard GitHub-hosted image unless it cannot fit one. The
# P1 repositories routed nearly every job to self-hosted pools for a push to
# main and a same-repository PR (go-qrdb 46 self-hosted references and no
# hosted runs-on), and about 250 jobs queued on the fleet while the 40
# hosted slots of a public repository's free standard runners sat idle. The
# preflight step `Runner labels (ruling 633)` gains two findings on
# github.com, for every job that does not name `release`: (c) its runs-on
# resolves, on some event, to anything but a standard GitHub-hosted image
# (ubuntu-latest, ubuntu-24.04, ubuntu-22.04, their -arm forms, ubuntu-slim),
# unless the runs-on line carries `# self-hosted: <reason>` (CUSTOMIZE: the
# jobs that cannot fit a standard runner, 4 vCPU, 16 GB, about 14 GB of disk
# and about 45 GB after `Free runner disk`: very large images or memory,
# privileged devices, hardware); (d) it names a larger runner (cores, large,
# xlarge, gpu), refused even with a reason, since a larger runner bills on a
# public repository. Every template job already passes; a repository adopts
# v1.43 by moving each job that fits to `ubuntu-latest` (keeping `Free runner
# disk` before an image build) and giving each job that stays a reason.
# v1.42 (2026-11-16): the CI Gate is hermetic. Its
# outcome depends only on the tree under test, on every event. The checks
# that fail on the state of the world rather than on a change leave ci.yml
# on every event: `make deps-check` (newer upstream releases and
# govulncheck's vulnerable requirements, both read from the network), the
# advisory half of `make security` (govulncheck and trivy fs against a fresh
# database) and `trivy image` of the integration image. Before it they turned
# mains red on their own, when an advisory or an upstream release appeared,
# and every PR cut from that main inherited the failure; v1.41's parity put
# them on every PR as well. They run only in scans.yml (scans v1.0.0, which
# replaces deps-bump.yml), on a schedule and on workflow_dispatch on main,
# never on a pull_request or a push. That workflow opens or updates ONE fix
# PR on ci/deps-bump with the bumps, and ONE issue for a finding the bump
# cannot clear. It is not the CI workflow, so a finding never reads as a red
# main and never starts revert-red-main.yml. gosec reads only the tree and
# stays on every event: the lint job runs `make gosec` again (v1.41 dropped
# the step and ran gosec inside `make security`). The lint job drops the
# deps-check steps and the image job drops `make security` and `trivy image`;
# the jobs, the needs list and CI Gate's check lines are unchanged.
# publish-images, on the release runner and never a PR gate, scans the
# toolchain image before it pushes it (ci-image-cache.sh v3). A repository
# adopts v1.42 in one CI-file PR that also takes ci-image-cache.sh v3,
# deletes .github/workflows/deps-bump.yml and adds scans.yml v1.0.0.
# Every other job, gate and tier is v1.41's.
# v1.41 (2026-11-16): PR/main parity. Every job and
# step that runs on a push to main also runs on a pull_request to main, with
# the same steps, so a PR never merges a change that main then fails on.
# CI_FULL_TIER is true on every event but a workflow_dispatch off main and
# off ci/deps-bump (which the preflight refuses), so a PR runs integration,
# make security and trivy image as main does; the integration job's `if:`
# no longer skips a PR. The `make gosec (PR tier)` step goes: make security
# runs gosec on every event. A PR run with a green Integration job proves its
# tree, so the squash merge of an up-to-date PR is a proven push and main
# skips its bigdisk jobs (v1.30 fix 2). `ci:full` no longer selects a tier;
# it only turns off the two PR path scopes below. The exceptions, each a job
# that cannot run on a PR by nature or a scope whose inputs a PR does not
# change: publish-images (pushes images to the registry from the release
# runner, and no PR job may reach that runner); soak (schedule and
# workflow_dispatch only, never on a push either, so no parity gap); the
# docs-only scope (a PR whose every file matches DOCS_ONLY_PATTERN skips build
# and make coverage, whose inputs it does not touch) and the lint-gates path
# scope (LINT_GATES_PATTERN); a docs-only PR skips the image job (make security,
# trivy image) as before and now integration too, so CI Gate checks integration
# as `code`, not `full`. A repository adopts v1.41 in one CI-file PR and
# sizes its PR runner capacity for the integration job on every PR.
# Every other job, gate and tier is v1.40's.
# v1.40 (2026-11-16): a library behind a newer upstream
# release never fails CI. The deps-check step passes DEPS_CHECK_LAG=report on
# every event, so depscheck v1.1.0 (`-lag report`) reports every lag and fails
# only a vulnerable go.mod requirement, a lookup failure, and a fork replace or
# pseudo-version with no reason comment on a line the change adds or bumps
# (v1.39). Before it, deps-check turned 11+ PRs red across three
# repositories for upstream releases the PRs never touched. The daily
# deps-bump.yml (deps-bump v1.1.0) keeps the full gate and carries every lag
# as ONE PR on ci/deps-bump. A repository adopts v1.40 in one CI-file PR with
# scripts/depscheck v1.1.0, the Makefile's `-lag $(DEPS_CHECK_LAG)` argument
# and deps-bump.yml v1.1.0. Every other job, gate and tier is v1.39's.
# v1.39 (2026-11-14): deps-check fails a
# library behind its latest release only when the change adds that go.mod
# requirement or changes its version, or when govulncheck reports a version of
# a go.mod requirement vulnerable (stdlib, toolchain and indirect-only findings
# are reported); a lag the change did not touch is reported, not failed. A new
# lint-job step, `Base commit for deps-check (ruling 640)`, fetches one
# commit at depth 1 and exports DEPS_CHECK_BASE: the pull request's base sha
# (the merge ref's first parent) or a push's `before`; a schedule or
# workflow_dispatch run sets none and keeps the full gate. `make deps-check`
# receives it as a make variable. The preflight refusal of a workflow_dispatch
# off main exempts refs/heads/ci/deps-bump, which runs the PR tier: a PR that
# GITHUB_TOKEN opens starts no pull_request run, so deps-bump.yml dispatches
# this workflow there. The repository's deps-check is the shared
# depscheck v1.0.0 (templates/deps/depscheck) with `-vuln`, and the daily
# deps-bump.yml (deps-bump v1.0.0) opens the one PR on ci/deps-bump that
# carries the bumps. A repository adopts v1.39 in one CI-file PR with
# scripts/depscheck, its Makefile's deps-check and deps-bump targets, and
# .github/workflows/deps-bump.yml. Every other job, gate and tier is v1.38's.
# v1.38 (2026-11-14): release and publish
# jobs run only on `[self-hosted, linux, x64, release]`, and no pull request
# job ever does. A pull request's test code reached the Docker daemon that
# main's image builds and the Trivy gate also used, so it could re-tag a base
# or scan image they then trusted. publish-images moves to
# that label; on GitHub it runs only when the repository variable
# RELEASE_RUNNER is `true`, so no run waits on a label with no runner, and on
# Gitea it runs as before. A new preflight step, `Runner labels`,
# fails CI when a workflow of the repository has a job that names
# `release` and that a pull request could run, or whose `if:` does not
# restrict it to a push to main or a tag, or a workflow_dispatch on main.
# The bigdisk-docker pools get a rootless Docker daemon of their own at the
# same /var/run/docker.sock path (no workflow change; see ci-standard.md
# §3a). A repository adopts v1.38 in one CI-file PR that also moves its
# release.yml jobs to the release label, pins its build and scan images by
# @sha256 digest and pulls them by digest before docker create or run, and
# sets RELEASE_RUNNER only once Infrastructure reports the release pools
# live. Every other job, gate and tier is v1.37's.
# v1.37 (2026-11-13): every job in every template carries
# timeout-minutes so a hung job ends itself. Ceilings by kind: unit, race,
# lint and other test jobs 60; integration, image builds, soak and release
# 120; gates and aggregators 10. A repository sets a job at or under its
# ceiling, sized at 1.5 x the job's longest green run; a job whose green
# runs need more keeps its measured value. automerge.yml, nightly.yml and
# revert-red-main.yml gain the timeouts they lacked.
# v1.36 (2026-11-13, owner approval: keep CI caches
# local): a self-hosted job never restores or saves the Actions cache, which
# lives in Azure blob storage behind the office's internet line. The
# self-hosted pools give every job persistent
# per-host caches: GOCACHE and GOMODCACHE, CI_HOST_CACHE for anything else a
# repository caches (trusted-firmware's OP-TEE stack under
# $CI_HOST_CACHE/optee/<pin>, renamed into place whole), GOPROXY and
# DEVCACHE_GOPROXY through Athens, and TRIVY_DB_REPOSITORY and
# TRIVY_JAVA_DB_REPOSITORY through the dev-cache ghcr mirror. So, in any job
# that can run self-hosted: every actions/setup-go step takes
# `cache: ${{ runner.environment != 'self-hosted' }}`, and an actions/cache
# step runs only when a CI_HOST_CACHE lookup missed (once per host and key).
# scripts/in-toolchain-image.sh v6 passes the TRIVY_* settings to a bridge
# stage. GitHub-hosted jobs are unchanged. Every job, gate and tier is
# v1.35.3's.
# v1.35.3 (2026-11-12): `pull_request` also fires on
# `ready_for_review`. A draft runs no CI (v1.26), and marking it ready started
# no run, so every draft converted to ready sat with no CI until someone
# pushed or closed and reopened it (go-quicraft reopened 8 PRs by hand). The
# ready_for_review run is the PR's first real run: the draft had none in
# flight for it to cancel. This supersedes v1.26's "no ready_for_review
# trigger" and its empty-commit step. Every job, gate and tier is v1.35.2's.
# v1.35.2 (2026-11-11, a Codex
# finding): the `Signatures` job leaves this workflow. It ran in the pull
# request's own workflow, so the pull request's tree held the verifier that
# judged it. It is now signatures.yml (signatures-template v1), on
# pull_request_target: GitHub reads it from the base branch, it checks out
# the base only and reads the pull request's commits as objects, and it no
# longer reads the registry from the head. CI Gate drops `signatures` from
# its needs; the ruleset requires `Signatures / Signatures` beside it. A
# repository adopts v1.35.2 in one CI-file PR: ci.yml, signatures.yml and
# .github/allowed_signers. Every other job, gate and tier is v1.35.1's.
# v1.35.1 (2026-11-11, Codex
# findings): the Signatures job fetches a named base that is not in
# the clone and fails closed when it still cannot be read (it no longer falls
# back to the head's registry and the head commit alone), and its
# signature-presence check reads the whole commit object, so a long signed
# message cannot fail under pipefail with SIGPIPE.
# v1.35 (2026-11-11, owner decision on commit signing): a
# `Signatures` job verifies every commit in the range against the
# repository's .github/allowed_signers registry, read from the base commit,
# and accepts a GitHub-made commit only when the API reports it verified as
# web-flow; it fails closed and is in CI Gate's needs as a `pr` job. A
# repository adopts v1.35 in one CI-file PR with its .github/allowed_signers
# (handbook software/templates/signing/<repo>.allowed_signers); every other
# job, gate and tier is v1.34.1's.
# v1.34.1 (2026-11-08, Tenant Agent m2226 item 2, ruling 377): one change.
# GO_BUILD_PROXY is <DEVCACHE_GOPROXY>|https://proxy.golang.org, with no
# trailing `direct`: the handbook allows no direct fetch anywhere
# (dependency-resolution.md, "No direct fetch, anywhere"). A private module
# is unaffected, because GOPRIVATE/GONOPROXY paths never use GOPROXY. Every
# job, gate and tier is v1.34's, and in-toolchain-image.sh is v5. A
# repository adopts v1.34.1 in its v1.34 adoption PR, or in one CI-file PR
# if v1.34 is already merged.
# v1.34 (2026-11-08, Tenant Agent m2211 item 2(b)): fewer jobs per run. The
# `changes`, `schedule-guard` and `arch-gates` jobs are one `preflight` job,
# in that order of concern but with the guard first and nothing checked out
# before it. The template's job count goes from 10 to 8, and a PR run starts
# two fewer hosted runners. Their outputs are needs.preflight.outputs.*, and
# CI Gate checks `preflight` in their place. The unit and race shards are
# the repositories' own CUSTOMIZE jobs: each merges its shards into one job
# in its v1.34 adoption PR. A repository adopts v1.34 in one CI-file PR.
# v1.33.2 (2026-11-08, Tenant Agent m2113 item 3, with InfoSec): the
# releasability step takes an InfoSec waiver. A matched line that carries
# `lab-string-ok: <reason>` on the same line, the colon and a reason
# required, is not a failure; a bare marker is. The step prints the path and
# line of each waived line as a notice and its count, never the value
# (go-trusted-platform #1348's mechanism, ported).
# v1.33.1 (2026-11-08, Tenant Agent m2107 item 4): comments only; the
# pattern file's source is named as dept-infosec
# security/internal-names.patterns, not platform-configs.
# v1.33 (2026-11-08, Tenant Agent m2104 item 2): the releasability step
# knows the five classes of the regenerated pattern file: coord-host,
# internal-email, lab-address, lab-host and owner-path (optional `/i`).
# With the v1.32 set of three, every gate run on the new secret failed on
# an unknown class. The image namespace comes from the repository variable
# CI_IMAGE_NAMESPACE (Tenant Agent m2101 item 2).
# v1.32 (2026-11-08, Tenant Agent m2098 item 2, InfoSec finding): the
# releasability step reads the private pattern file as it is written. Each
# line is `class<TAB>regex` (blank and `#` lines skipped); v1.31 grepped the
# whole line as one fixed string (-F), so no line could match and the gate
# was green for a false reason. The step now checks the class (lab-address,
# lab-host or owner-path, optional `/i`), checks each regex with grep -E,
# fails on a malformed line printing its number only, and runs
# `git grep -i -E` over the regex fields, printing path and line only.
# v1.31 (Tenant Agent m2069 item 3, owner rule 2026-11-07): the internal-name
# gate reads its patterns from the private side. A public repository never
# lists the company's names, hosts or addresses, not even as patterns to
# refuse. The lint job's `Releasability (private patterns)` step takes the
# pattern file from the Actions secret RELEASABILITY_PATTERNS (v1.32:
# class<TAB>regex lines; the source file is dept-infosec
# security/internal-names.patterns) and fails on
# any match in the tracked tree, printing path and line only, never the
# value. RELEASABILITY_TEST keeps the repository's own test, which checks
# generic shapes only (public-hygiene.md "Internal values stay private").
# v1.30 (Tenant Agent m1804, 2026-10-31): the five fixes of the 72-hour CI
# evaluation (ci-standard.md §12). go-qrdb #1328, three comment lines, cost
# about 1100 runner-minutes over three runs, and every push to main reran the
# full tier on a tree a run had already proved.
#   1. The toolchain image is built once per content hash (Dockerfile, pin
#      file, go.mod and go.sum, ci-standard.md §9) by the new publish-images
#      job on the release runner, and pulled from the registry cache by every
#      other job (scripts/ci-image-cache.sh v1, ships beside this file). The
#      lint-class stages leave the image job for the new `lint` job, which
