# CI for go-enclave.
#
# EVERY STEP IS A MAKE TARGET (#89, handbook devops §4: "the Makefile is the
# contract"). This file decides WHERE and IN WHAT ORDER checks run; the
# Makefile decides WHAT they are — commands, flags, pinned tool versions and
# the coverage floor. A red step here reproduces locally with the same `make`
# line, and a check cannot pass in one place and fail in the other because
# the two were spelled differently.
#
# The pipeline is STAGED and fails fast by ordering rather than by
# cancellation: a fast tier (lint + build) gates the expensive tier (security
# and tests). A broken push reports in minutes and burns nothing downstream; a
# green push pays one fast tier of extra latency. The final gate distinguishes
# a SKIPPED stage (an upstream stage failed) from a FAILED one, and fails
# closed on either. Gitea has no cancel API and does not honour `concurrency:`
# (devops §9b), so ordering is the only fail-fast there is.
#
# Long-horizon checks — FIPS-strict test runs and `trivy fs` — live in
# nightly.yml rather than on the push path (devops §8a: alpha phase), so a slow
# job cannot burn runner time per push to tell us something a nightly run
# already does. release.yml runs everything, trivy included, on a tag.
#
# Things here that are the result of being burned, and are worth understanding
# before editing:
#
#   * TOOLS ARE NEVER NETWORK-INSTALLED ON OUR RUNNERS. TOOL_INSTALL=0 makes
#     every lint and security target require its tool on PATH at exactly the
#     Makefile's pin and fail closed otherwise. The runner image bakes the
#     tools at those versions; a workflow that `go install`ed over them once
#     replaced the baked golangci-lint v2.13.2 with a v2.12.2 that cannot lint
#     Go 1.27 (9 of 12 sampled repos were in that state), `@latest` installs
#     produced unattributable "Version: dev" scans (go-luks2 #21), and the
#     installs themselves failed whenever sum.golang.org was unreachable. A
#     mismatch is fixed by raising the pin and the image together, never by
#     installing. On github.com there is no baked image, so the same targets
#     install the same pins into the workspace (TOOL_INSTALL=1).
#
#   * gosec and govulncheck TRIAGE THEIR OWN EXIT CODES (in the Makefile). A
#     shell reports a signal death as 128+N, so a scanner killed by the OOM
#     killer exits 137 — indistinguishable, in a job summary, from a real
#     finding. The targets still fail either way; they only say WHICH.
#
#   * NEVER add `GOPROXY: direct` or `GOSUMDB: off` to an env block. The
#     blanket override disables checksum-database verification for every
#     third-party dependency, and breaks the build the moment an upstream
#     re-points a tag.
#
# Some steps are guarded on `github.server_url` so host-specific tooling runs
# only where it exists.

name: CI

on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
  workflow_dispatch:                  # re-fire the workflow by hand; also
                                      # the only retry when a run was
                                      # never created in the first place

# Read-only by default. Only the job that uploads SARIF (Security, on
# github.com) is granted security-events: write, at job level.
permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"        # portfolio standard (owner ruling 2026-09-01). The
                              # ci-runner image seeds this into the toolcache and
                              # the review image runs it with GOTOOLCHAIN=local, so
                              # both halves of the bump are in place -- raising the
                              # go directive alone would break the hosted review.
                              # nightly.yml and release.yml MUST carry the same value.
  # 0 on our runners: require the image's baked tools at the Makefile's pins,
  # install nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go.mod and go.sum are tidy
        run: make tidy-check

      # gofmt, go vet, golangci-lint, actionlint (with shellcheck over every
      # run: block) and shellcheck over scripts/. .golangci.yml must enable
      # staticcheck, errcheck, unused, ineffassign, misspell, gocritic — the
      # umbrella with the security linters off does not satisfy the gate.
      - name: Lint
        run: make lint

      - name: staticcheck
        run: make staticcheck

      # THE PIN GATE (#70). Every `uses:` in every workflow must name a 40-hex
      # commit, not a tag and never a branch.
      #
      # This runs here, on every push, because the pin does not hold by itself.
      # A sibling repo re-pinned the same line four times; each regression
      # arrived as collateral in a fleet rollout of a workflow template whose
      # real payload was something else, and four reviewers read past it. A
      # one-line ref change inside a large mechanical diff is precisely what
      # human review is worst at, so the check has to be mechanical too.
      #
      # It parses the YAML rather than grepping it — see the rationale in
      # test/buildgates/action_pins_test.go — and it lives in its own Go module
      # so that the parser never enters the root module's dependency graph.
      - name: Action refs are pinned to commit shas
        run: make check-action-pins

      # THE PUBLIC-RELEASABILITY GATE (#80). No tracked file names the lab
      # fleet — an address, a host, the owner's paths — and no agent-only file
      # (CLAUDE.md, task-worker.yml) is tracked. The public tree is
      # byte-identical to the release tag, so the scrub has to hold in the
      # source on every push, not be redone at publication. Rules, waivers and
      # rationale: test/buildgates/releasability_test.go.
      - name: Tracked tree is publicly releasable
        run: make check-releasability

      # The CHANGELOG fragment assembly `make release-alpha` runs before
      # tagging (#80, release-versioning §5): every fragment lands in the
      # version's section exactly once and is then deleted.
      - name: CHANGELOG fragments assemble into the release
        run: make check-changelog-assembly

      # The scripts release.yml runs on a tag — with a token that can write to
      # the forge — and the tool resolver every gate above trusts (#89). They
      # are driven offline on scratch inputs here, because the tag is too late
      # to find out one is broken. Includes building and running the
      # throwaway consumer against this tree, so an API change that breaks it
      # fails in the PR that made it.
      - name: Release and tooling scripts
        run: make check-scripts

  security:
    name: Security
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST: gated on the fast tier like test — a push that
    # cannot lint or build should not spend a heavy gosec/govulncheck pass.
    needs: [lint, build]
    # THE GO TOOLCHAIN IS CGROUP-UNAWARE. Inside a job container capped at
    # 16 GB, `nproc` still reports the host's core count and /proc/meminfo still
    # reports the host's memory, because both come from the HOST. Consequences,
    # measured against a live gosec run (cgroup memory.stat):
    #   - gosec defaults its worker count to NumCPU, so it ran 24 concurrent
    #     analyzers, each holding package ASTs/SSA.
    #   - Go's GC, with GOGC=100 and no GOMEMLIMIT, lets the heap roughly double
    #     before collecting and has no reason to stop short of what it believes
    #     is a 94 GB machine.
    # The heap blew past the 16 GB cgroup cap: memory.current 15.78 GB pinned at
    # the limit, memory.swap.current 10.93 GB, memory.events "max" 19440, and
    # anon 14.90 GB. Because the memory is ANONYMOUS, the kernel's only reclaim
    # path is swap — and because swap absorbed it, oom_kill stayed 0, so it
    # never failed fast. It just thrashed: host memory PSI 98, io PSI 98, 43% of
    # all CPU in iowait, dragging every other job on the box down with it. The
    # host had 56 GB FREE the whole time; the cap is per-cgroup, so more RAM
    # would have changed nothing.
    #
    # GOMEMLIMIT makes the GC treat the container's budget as real and collect
    # instead of growing. GOMAXPROCS bounds the Go runtime's parallelism; it
    # does NOT shrink gosec's worker pool (sized from NumCPU), which is why
    # `make gosec` passes -concurrency=4 — that flag is the part of the memory
    # bound that actually works, verified on three concurrent scans all
    # carrying GOMEMLIMIT=10GiB at 16/16 GiB. Keep GOMEMLIMIT comfortably BELOW
    # the container cap — it is a soft limit and non-heap memory lives outside
    # it, and it cannot collect LIVE memory, which is why govulncheck (whole
    # package graph and SSA live) can still be killed when siblings crowd the
    # host; its exit is triaged for exactly that.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    permissions:
      contents: read
      security-events: write  # the gosec SARIF upload on github.com; unused on Gitea
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Writes gosec.sarif and prints the same findings as text, so a Gitea
      # failure (no code-scanning API) shows them in the log.
      - name: gosec
        run: make gosec

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: govulncheck
        run: make govulncheck

      - name: Verify module integrity
        run: make modverify

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: make build

      # Every supported GOOS/GOARCH, 32-bit included. providertest did not
      # compile on linux/386 or linux/arm through v0.6.1-alpha and nothing here
      # noticed, because nothing built it there. The target list lives in the
      # Makefile so a local `make ci` and this job cannot disagree.
      - name: Cross-build all packages
        run: make cross-build

  # FIPS (owner mandate 2026-08-17, security-review.md §6) runs nightly
  # (nightly.yml -> `make test-fips`), not here; moving it onto the push path
  # is a deliberate decision, not a drive-by.

  test:
    name: Test
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST: the expensive tier
    # starts only when the fast tier (lint+build, ~minutes) is green, so a
    # broken push reports in minutes and burns nothing downstream — Gitea has
    # no cancel API, so fail-fast can only come from ordering.
    # This supersedes an earlier lint-decoupling: that fix targeted a SILENT
    # skip masquerading as test failure; the
    # outage class is now closed at the source (linter pinned) and the gate
    # below reports skipped-because-upstream-failed distinctly, so a blocked
    # test run is loud, attributed, and fail-closed — not silent.
    needs: [lint, build]
    timeout-minutes: 30       # give the suite honest headroom
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # repo-specific environment tuning goes here (e.g. QUIC UDP
      # buffer sysctls). Note job containers may have a read-only /proc/sys —
      # tune the runner HOST for settings that matter; with host networking
      # the host's values apply.

      # `make coverage` runs the suite with TESTFLAGS (-race -count=1
      # -cpu=1,2,8) and FAILS below the Makefile's COVERAGE_THRESHOLD.
      #
      # -race IS NOT OPTIONAL. It is the sole detector for the
      # publication-ordering defect class in the shutdown registry: measured
      # 10/10 against the restored defect with the detector on, 0/10 with it
      # off. Removing the flag to speed this job up would retire that
      # guarantee silently — every test would still pass.
      #
      # -cpu=1,2,8 IS NOT OPTIONAL EITHER, and for the mirror-image reason
      # (#61). One direction of the retune/admission race — a lowering that
      # takes the contested page while `reserve` is between its read of the
      # headroom counter and the compare-and-swap that acts on it — has no test
      # seam and cannot get one: the seam would sit on the lock-free admission
      # path this type exists to keep free of branches and syscalls (benchmarked
      # in #49). It is caught by CONTENTION instead, so how reliably it is caught
      # is a property of the RUNNER, not of the suite — and a runner's core count
      # is not something this repo controls. The list makes a multi-core run
      # happen even on a single-core or heavily-pinned runner.
      #
      # Measured on an 8-core host against `reserve` regressed to
      # read-then-subtract, 10 runs of the whole package at each setting:
      #     -cpu=1  ->  0/10 killed the mutant   (single core CANNOT see it)
      #     -cpu=2  ->  6/10
      #     -cpu=8  -> 10/10
      # So -cpu=1 alone is blind to it and the default (GOMAXPROCS = whatever the
      # runner has) is a coin toss on a small runner. Do not trim the list to one
      # value to save time; 8 is what makes the kill reliable and 1 is what keeps
      # the few-core paths honest.
      #
      # Cost, measured on the same host: 74s -> 195s for this step (2.6x, not 3x
      # — the coverage-instrumented build dominates). That is ~3.3 min against
      # this job's 30-minute timeout.
      - name: Tests with coverage (race, CPU matrix, threshold)
        run: make coverage

      # The erasing build (#98): every AES operation under runtime/secret.Do,
      # and the test that proves the key schedule is gone from memory, exist
      # only with GOEXPERIMENT=runtimesecret, so they get a run of their own.
      - name: Unit tests with key-schedule erasure (GOEXPERIMENT=runtimesecret)
        run: make test-runtimesecret

  # a repo that builds container images adds an `image` job here that
  # builds each image and gates it with `trivy image --severity CRITICAL,HIGH
  # --exit-code 1` BEFORE any push to either registry. Never
  # image-scan the devcontainer into code scanning.

  # The single required check. Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # trivy and fips live in nightly.yml, off the push path; they gate
    # nothing here.
    needs: [lint, security, build, test]
    steps:
      - name: Fail closed on any non-success
        run: |
          # skipped ≠ failed, but BOTH fail the gate: a skipped job means an
          # upstream gate failed (staged fail-fast), and naming it prevents
          # a red that looks like a test failure while tests never ran.
          check() { case "$2" in
            success) echo "OK   $1";;
            skipped) echo "SKIP $1 (upstream stage failed — see its job)"; BAD=1;;
            *)       echo "FAIL $1 ($2)"; BAD=1;;
          esac; }
          BAD=0
          check lint     "${{ needs.lint.result }}"
          check security "${{ needs.security.result }}"
          check build    "${{ needs.build.result }}"
          check test     "${{ needs.test.result }}"
          exit $BAD
