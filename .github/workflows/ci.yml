# ci-template: v1.18 (customized)
#
# CI for go-enclave. Every job starts at once (ci-template v1.14), so a run
# takes as long as its slowest job; ci-gate, the one required check, needs every
# job and fails closed on any result but success. push runs on main only:
# automerge.yml's merge trains are PRs from merge-train/* and get their CI from
# pull_request (v1.15).
#
# FIVE STAGES IN THE DEVCONTAINER (#217; handbook ci-standard.md §1-§2). `make
# build`, `make test`, `make security`, `make deps-check` and `make
# integration-test` run in the devcontainer image built from
# build/docker/devcontainer/Dockerfile at the commit under test, never on runner
# tools. Each job is make lines: the Makefile decides WHAT a check is
# (commands, flags, pinned tools, the coverage floor), this file WHERE and IN
# WHAT ORDER. A red job reproduces locally with `make docker-run CMD='make
# <target>'`.
#
# Two tiers (#175; handbook sdlc.md §5a, devops.md §1/§5):
#
#   PR tier    every run. lint, image.
#   Full tier  push to main, workflow_dispatch (the coordinator's nightly), or
#              a pull_request carrying the label `ci:full`. fips, integration.
#              `ci:full` takes effect on the PR's next push or update-branch,
#              because a label event starts no run.
#
# Each full-tier job carries the same `if:`, spelled out per job because
# Gitea's workflow parser does not expand YAML anchors. ci-gate passes a
# full-tier job that its tier skipped and nothing else that skipped. A
# full-tier job may need a PR-tier one; never the reverse. build/ci/buildgates
# (TestCIGateTiersMatchTheJobs) holds the jobs, the `if:`s and the gate's tier
# tags to this.
#
# Things here that are the result of being burned:
#
#   * TOOLS ARE NEVER NETWORK-INSTALLED ON OUR RUNNERS. TOOL_INSTALL=0 makes
#     every lint target require its tool on PATH at exactly the pin in
#     scripts/tool-pins.sh and fail closed otherwise (go-luks2 #21: `@latest`
#     installs produced unattributable "Version: dev" scans). actionlint is the
#     one exception: scripts/tool.sh builds it at the pinned tag (#145, #146).
#     On github.com there is no baked image, so the same targets install the
#     same pins into the workspace (TOOL_INSTALL=1).
#
#   * gosec and govulncheck TRIAGE THEIR OWN EXIT CODES (in the Makefile): a
#     scanner killed by the OOM killer exits 137, which a job summary cannot
#     tell from a finding. The targets fail either way; they only say WHICH.
#
#   * NEVER add `GOPROXY: direct` or `GOSUMDB: off` to an env block: it turns
#     off checksum-database verification for every dependency.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No `labeled` (#853 in go-trusted-platform; DS-2281). Gitea 1.27.1 sends
    # every label add AND remove as `label_updated`, and its matcher maps that
    # to `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or runs via workflow_dispatch.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs. Keyed on the ref so a branch only supersedes itself,
# and set at workflow level so the whole superseded pipeline goes.
# cancel-in-progress is the literal `true` because Gitea does not evaluate
# expressions there. ci-gate treats `cancelled` as a failure, which never
# blocks a merge: only a superseded commit gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing is uploaded to code scanning: the scans run in the
# toolchain image and gate the run (Gitea has no code-scanning API).
permissions:
  contents: read

env:
  # 0 on our runners: require the baked tools at the pins, install nothing.
  # 1 on github.com, which has no baked image. Only lint reads it.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}
  # Modules resolve from tags, never from a workspace (the Makefile and
  # release.yml set the same).
  GOWORK: "off"

jobs:
  # CUSTOMIZE: lint stays a runner job and runs `make ci-lint`, not `make lint`:
  # tidiness, golangci-lint (vet, staticcheck, gosec) in both builds,
  # actionlint, shellcheck, the integration suite's lint and every build gate
  # (action pins, releasability, changelog assembly, the scripts).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-lint

  # CUSTOMIZE (ci-template v1.18, image job): builds the devcontainer images
  # from build/docker/devcontainer/Dockerfile at this commit, runs the
  # toolchain stages in the toolchain image (handbook ci-standard.md §1-§2),
  # and gates the integration image with trivy image. The checkout is copied
  # into each toolchain container (scripts/in-toolchain-image.sh): the daemon
  # is reached through a socket, so a bind mount would resolve on its host.
  # make security and make deps-check get a network, for the vulnerability
  # databases and the module proxy; build and test run without one. The scan
  # is a gate only: nothing is uploaded to code scanning. No module
  # credentials: the one dependency resolves from the public proxy.
  image:
    name: Devcontainer image [build, test, security, deps-check, trivy image]
    runs-on: bigdisk
    timeout-minutes: 90
    env:
      IT_IMAGE: go-enclave-ci-it:${{ github.run_id }}-${{ github.run_attempt }}-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-enclave-ci-

      - name: Build the toolchain and integration images
        run: |
          GO_ENCLAVE_IT_IMAGE="$IT_IMAGE" make docker-build
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make build (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make build

      # CUSTOMIZE: the cross-build link check (ci-build's second half) for every
      # supported GOOS/GOARCH: providertest did not compile on linux/386 or
      # linux/arm through v0.6.1-alpha and nothing noticed.
      - name: make cross-build (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make cross-build

      # CUSTOMIZE: the test stage is `make ci-test`, the race suite across
      # -cpu=1,2,8 with the per-package coverage floor, then the key-schedule
      # erasure build (GOEXPERIMENT=runtimesecret, #98). `make test` would run
      # the same race suite a second time without the floor.
      - name: make ci-test (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make ci-test

      - name: make security (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make security

      - name: make deps-check (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # CUSTOMIZE: the flags scripts/integration-image.sh scans with (fixable
      # only, .trivyignore), so the PR tier and ci-integration agree.
      - name: trivy image (integration image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            trivy image --input it-image.tar --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 --ignorefile .trivyignore --skip-version-check

      - name: Tear down
        if: always()
        run: |
          rm -f it-image.tar
          docker image rm "$IT_IMAGE" || true

  # CUSTOMIZE: FIPS 140-3 strict unit tests (owner mandate 2026-08-17,
  # security-review.md §6), full tier since #154/#175, in the toolchain image.
  # GOFIPS140=latest + GODEBUG=fips140=only (STRICT, never `on`), set by the
  # target; one run without -race or the CPU matrix, because it hunts
  # non-approved cryptography on a tested path. A failure IS the finding: fix
  # the call site, never weaken the target.
  fips:
    name: FIPS
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IT_IMAGE: go-enclave-ci-it:${{ github.run_id }}-${{ github.run_attempt }}-fips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-enclave-ci-

      - name: Build the toolchain image
        run: |
          GO_ENCLAVE_IT_IMAGE="$IT_IMAGE" make docker-build
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make test-fips (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test-fips

      - name: Tear down
        if: always()
        run: docker image rm "$IT_IMAGE" || true

  # CUSTOMIZE (integration settings): the integration stage is `make
  # ci-integration`, the suite in the hardened integration image: the
  # user-namespace test, the default run and the FIPS 140-3 strict run
  # (GOFIPS140=latest, GODEBUG=fips140=only, verified in the suite), all on one
  # image that scripts/integration-image.sh builds under a run-unique tag,
  # trivy-scans and removes. Each suite is its own compose project
  # (go-enclave-it-*, go-enclave-userns-*) torn down on exit; the reaper
  # removes what a dead runner left. Docker is a hard requirement: the targets
  # fail, never skip. trivy is copied out of the toolchain image at the pin;
  # nothing is downloaded, so the job sets no TOOL_INSTALL.
  integration:
    name: Integration
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reap stale CI stacks
        run: |
          scripts/reap-stale-ci-stacks.sh go-enclave-it
          scripts/reap-stale-ci-stacks.sh go-enclave-userns-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Pinned trivy from the toolchain image
        run: |
          set -eu
          sh build/ci/toolchain-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: make ci-integration

  # The single required check. Every job above must appear in BOTH the needs
  # list and the results check, tagged with its tier (pr or full): a gate that
  # can pass vacuously is worse than no gate. FULL is the full-tier condition
  # itself, so a full job's skip passes only in a run that did not select it.
  # Do not use join(needs.*.result); it evaluates empty on Gitea and reports
  # success while jobs fail.
  #
  # CUSTOMIZE: the template's check() logic is build/ci/summary.sh, carried
  # inline (release.yml runs the same file), on the reserved `ci-gate` label:
  # in Gitea Actions even a needs-only job takes a runner slot, so on the
  # shared label the gate queued behind PR jobs. Those runners are 1-CPU
  # slots, so the gate has no checkout and no action.
  ci-gate:
    name: CI Gate
    runs-on: ci-gate
    if: always()
    needs: [lint, image, fips, integration]
    steps:
      - name: Fail closed on any non-success
        env:
          FULL: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        # build/ci/summary.sh, verbatim (buildgates holds the copy to the file).
        run: |
          script=$(mktemp)
          cat > "$script" <<'SUMMARY'
          #!/bin/sh
          # summary.sh — the pass/fail summary a gate job ends with: one line per job,
          # and a failure unless every job the run selected succeeded.
          #
          # Usage: sh build/ci/summary.sh <message> <full> <tier>:<job>=<result>...
          #
          # <message> is the error printed when any job did not pass. <full> is `true`
          # when this run selected the full tier and `false` when it did not; <tier> is
          # `pr` (the job runs on every event) or `full` (only when the full tier is
          # selected). A skipped job fails the gate like a failed one: a job that never
          # ran proved nothing. The one exception is a `full` job skipped in a run that
          # did not select the full tier, because that job's `if:` was false by design.
          # Anything else (an unknown tier, a <full> other than true or false) fails
          # closed. The results arrive one per argument because Gitea does not implement
          # join(needs.*.result) (it evaluates empty and reports success while jobs
          # fail), so a workflow names every job it needs.
          set -eu

          [ $# -ge 3 ] || { echo "usage: $0 <message> <full> <tier>:<job>=<result>..." >&2; exit 2; }
          message=$1
          full=$2
          shift 2
          case $full in
            true|false) ;;
            *) echo "$0: <full> is '$full', want true or false" >&2; exit 2 ;;
          esac

          bad=0
          for pair in "$@"; do
            tagged=${pair%%=*}
            result=${pair#*=}
            tier=${tagged%%:*}
            name=${tagged#*:}
            case $tier:$result in
              pr:success|full:success) printf 'OK   %s\n' "$name" ;;
              full:skipped)
                if [ "$full" = false ]; then
                  printf 'OK   %s (full tier, not selected)\n' "$name"
                else
                  printf 'SKIP %s (did not run: see its job)\n' "$name"; bad=1
                fi ;;
              pr:skipped) printf 'SKIP %s (did not run: see its job)\n' "$name"; bad=1 ;;
              pr:*|full:*) printf 'FAIL %s (%s)\n' "$name" "$result"; bad=1 ;;
              *) printf 'FAIL %s (no pr: or full: tier tag)\n' "$pair"; bad=1 ;;
            esac
          done

          if [ "$bad" -ne 0 ]; then
            echo "::error::$message"
          fi
          exit "$bad"
          SUMMARY
          sh "$script" "a CI job did not pass" "$FULL" \
            pr:lint="${{ needs.lint.result }}" \
            pr:image="${{ needs.image.result }}" \
            full:fips="${{ needs.fips.result }}" \
            full:integration="${{ needs.integration.result }}"
