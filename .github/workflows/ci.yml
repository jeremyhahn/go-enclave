  # CUSTOMIZE: further stages run in the image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.
  # v1.29.2 (ruling 239(8)): a CUSTOMIZE job that runs only when certain
  # paths change (the changes job gains an output for them, `optee` here)
  # needs the image job as well, and its `if:` tests an image job output
  # that its build step sets (here `built`, which the image job declares in
  # `outputs:` when a repository adds such a job), never `needs.<job>.result`
  # and never the changes job's outputs alone. Reading `needs.preflight.outputs.*`
  # in the same `if:` is fine:
  #   needs: [preflight, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) }}
  # v1.29.3 (ruling 255(10)/(11)(c)): a CUSTOMIZE job on bigdisk adds
  # `preflight` to its needs (v1.34; `schedule-guard` before) and
  # `(github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run')`
  # to its `if:`, so it skips on a schedule run while main is busy. One that
  # needs the image job skips with it already.
  # v1.30: the test is `needs.preflight.outputs.verdict == 'run'` on
  # every event, so the job skips on a proven main push and on a refused run,
  # and its check line in CI Gate is full, pr or code as before: the gate
  # reads a proven skip as passed. Its timeout-minutes is ceil(1.5 x its
  # 72-hour p95) (ci-standard.md §12).

  # v1.35.2 (Tenant Agent m2577): the commit signature gate is not a job of
  # this workflow. It is signatures.yml, on pull_request_target, so it runs
  # from the base branch and a pull request cannot edit the script that
  # judges it. Its `Signatures / Signatures` check is required by the ruleset
  # beside CI Gate. v1.35 and v1.35.1 ran it here as `signatures`.

  # CUSTOMIZE (FIPS 140-3 strict): build and unit tests under GOFIPS140=latest
  # with GODEBUG=fips140=only (security-review.md §6), in the toolchain image,
  # on the full tier (CI_FULL_TIER's expression). Strict mode, never `on`,
  # which still permits non-approved algorithms: a failure here is the finding.
  # `make docker-build` builds the content-addressed integration image too, so
  # the job names it like the others and removes nothing.
  fips:
    name: FIPS
    needs: preflight   # v1.34
    # v1.26: never on a draft PR, ci:full or not.
    # CUSTOMIZE (go-enclave): and only on the guard's run verdict, so
    # a refused workflow_dispatch does not check out and run its branch.
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump') && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 11       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7   CUSTOMIZE: newer than the template's v6.1.0; never downgraded

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A GitHub-hosted runner has about 14 GB free; the image build needs more.
      - name: Free disk for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Build the toolchain image
        run: |
          make docker-build GO_BUILD_PROXY="${GOPROXY:-}" IT_IMAGE="$IT_IMAGE"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make test-fips (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test-fips

  # CUSTOMIZE (TPM provider conformance): backends/tpm's swtpm-tagged
  # tests (providertest conformance with its residue sweep, and the sealed
  # blob's length) against a throwaway swtpm, through `make
  # integration-test-tpm`. It is full tier, and its job-level `if:` is the
  # full tier's (the tier check pins it), so the path gate is per step: a
  # pull request runs the suite only when the changes job's `tpm` output is
  # true, and every other full-tier event always runs it. The suite runs on
  # the runner host with swtpm from the runner's apt and Go from setup-go, not
  # in the toolchain image: that container's network is none (or bridge),
  # which cannot reach swtpm on the host's loopback, and the image carries no
  # swtpm. A skipped suite step leaves the job green with the reason printed.
  tpm-swtpm:
    name: TPM swtpm Conformance
    # v1.26: never on a draft PR, ci:full or not, and only on the
    # guard's run verdict.
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump') && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    needs: preflight   # v1.34
    runs-on: ubuntu-latest
    timeout-minutes: 30       # CUSTOMIZE
    env:
      TPM_SELECTED: ${{ github.event_name != 'pull_request' || needs.preflight.outputs.tpm == 'true' }}
    steps:
      - name: Are the TPM paths selected?
        run: |
          if [ "$TPM_SELECTED" = true ]; then
            echo "TPM suite selected: running make integration-test-tpm"
          else
            echo "TPM suite not selected: this pull request changes no file under backends/tpm/, scripts/swtpm-fixture.sh or .github/workflows/ci.yml"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7   CUSTOMIZE: newer than the template's v6.1.0; never downgraded
        if: ${{ env.TPM_SELECTED == 'true' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ env.TPM_SELECTED == 'true' }}
        with:
          go-version-file: backends/tpm/go.mod
          cache-dependency-path: backends/tpm/go.sum

      # Retries, so that one transient mirror or DNS error does not fail the
      # job: one such error once failed main.
      - name: Install swtpm
        if: ${{ env.TPM_SELECTED == 'true' }}
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends swtpm swtpm-tools; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "swtpm install failed after $attempt attempts"; exit 1; }
            echo "swtpm install attempt $attempt failed; retrying in 20 s"; sleep 20
          done
          swtpm --version

      # The runner image moves its kernel; the run records which one it had.
      - name: Print the kernel
        if: ${{ env.TPM_SELECTED == 'true' }}
        run: |
          uname -a
          cat /proc/version

      - name: make integration-test-tpm
        if: ${{ env.TPM_SELECTED == 'true' }}
        run: make integration-test-tpm

  # CUSTOMIZE (go-enclave): the arm-trustzone harness
  # on the OP-TEE QEMU fixture. make integration-test-arm-trustzone compiles
  # the linux/arm64 test binary in the toolchain image and runs
  # scripts/optee-fixture.sh harness in OPTEE_FIXTURE_IMAGE, the CI image
  # Infra builds and keeps, whose prebuilt stack it boots: this job never
  # builds the stack (about 155 min cold). What the image holds is the
  # fixture image contract in docs/backend-conformance/engineering.md
  # (#fixture-image-contract). Full tier, with the tier `if:` CI Gate requires
  # of a full job and no path condition there: the first step reads the
  # changes job's `optee` output, and when no OP-TEE path changed every later
  # step is skipped, so the job succeeds without running the harness.
  optee:
    name: OP-TEE [arm-trustzone harness, fixture image]
    # The guard is named here, as in fips and tpm-swtpm. Not image: a
    # docs-only PR skips image, and optee must still run its select step and
    # report, since CI Gate checks it as full.
    needs: preflight   # v1.34; optee reports on a docs-only PR
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump') && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180      # CUSTOMIZE: the fixture image pull and the QEMU boot
    steps:
      # The path gate: selected only when the changes job's `optee` output
      # is true. Every later step tests the `run` output this step sets.
      - name: Select the OP-TEE harness
        id: select
        env:
          OPTEE: ${{ needs.preflight.outputs.optee }}
        run: |
          if [ "$OPTEE" = true ]; then
            echo "optee selected: OP-TEE paths changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "optee not selected: no OP-TEE paths changed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7   CUSTOMIZE: newer than the template's v6.1.0; never downgraded
        if: steps.select.outputs.run == 'true'

      # v1.21.1: mask the forge credentials before any other step (as in the
      # integration job).
      - name: Mask the forge credentials
        if: steps.select.outputs.run == 'true'
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A GitHub-hosted runner has about 14 GB free on /, and the fixture
      # image alone unpacks to 27.4 GB. Remove toolchains this job never uses
      # from / (about 25 GB) and move Docker's data root to the runner's
      # larger /mnt filesystem, on the classic image store so every layer
      # lands under the data root. The next step checks the room.
      - name: Free disk for the image build
        if: steps.select.outputs.run == 'true'
        run: |
          df -h / /mnt "$(docker info --format '{{.DockerRootDir}}')"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /etc/docker /mnt/docker
          conf=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          [ -n "$conf" ] || conf='{}'
          printf '%s\n' "$conf" |
            jq '. + {"data-root": "/mnt/docker", "features": ((.features // {}) + {"containerd-snapshotter": false})}' |
            sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          df -h / "$(docker info --format '{{.DockerRootDir}}')"

      # Fails closed: NEED_GB is the 27.4 GB fixture image (28), its
      # compressed layers, which a pull holds while it unpacks them (10), the
      # toolchain image the test binary compiles in (5), and the harness
      # container's copy of the checkout (2).
      - name: Check the room on Docker's data root
        if: steps.select.outputs.run == 'true'
        env:
          NEED_GB: 45
        run: |
          root=$(docker info --format '{{.DockerRootDir}}')
          df -h / "$root"
          free=$(df --output=avail -BG "$root" | tail -n 1 | tr -dc 0-9)
          if [ "${free:-0}" -lt "$NEED_GB" ]; then
            echo "::error::Docker's data root $root has ${free:-0} GB free; the OP-TEE job needs $NEED_GB GB (the 27.4 GB fixture image, its compressed layers during the pull, and the toolchain image)"
            exit 1
          fi
          echo "Docker's data root $root has $free GB free (need $NEED_GB GB)"

      # Fails closed: if the pin is ever emptied, this job fails here, never skips.
      - name: Require the fixture image pin
        if: steps.select.outputs.run == 'true'
        run: |
          OPTEE_FIXTURE_IMAGE=$(make -s optee-fixture-image)
          if [ -z "$OPTEE_FIXTURE_IMAGE" ]; then
            echo "::error::OPTEE_FIXTURE_IMAGE is empty in scripts/tool-pins.sh: pin the OP-TEE fixture image by its ghcr digest (re-run ghcr-optee-fixture.yml), so the arm-trustzone harness can run"
            exit 1
          fi
          echo "OPTEE_FIXTURE_IMAGE=$OPTEE_FIXTURE_IMAGE" >> "$GITHUB_ENV"

      - name: make integration-test-arm-trustzone (fixture image)
        if: steps.select.outputs.run == 'true'
        run: make integration-test-arm-trustzone OPTEE_FIXTURE_IMAGE="$OPTEE_FIXTURE_IMAGE"

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Tenant Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy and fips are in nightly.yml
  # (v1.9, devops.md §8a: the alpha regime).
  ci-gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner || '"ubuntu-latest"') || 'ci-gate' }}   # v1.48
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.preflight.outputs.verdict != 'busy') }}
    timeout-minutes: 5        # v1.30
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs. v1.30: lint
    # joins; publish-images is the one job outside the gate (see its comment).
    # CUSTOMIZE (go-enclave): the fips job stays here, tagged full, and has its
    # check line. build/ci/buildgates holds every job in needs to exactly one
    # check line and the gate to no checkout and no action.
    needs: [preflight, lint, image, lint-gates, fips, integration, soak, tpm-swtpm, optee]   # v1.34; v1.35.2 signatures.yml
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23); v1.41: every event, a PR
          # included, but a refused dispatch. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.preflight.outputs.verdict }}
          # v1.30: the proving run of a proven main push, the docs-only PR
          # flag (a `code` job skips on it) and the lint-gates path scope (a
          # `scoped` job skips when no file matched).
          PROOF: ${{ needs.preflight.outputs.proof }}
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only == 'true' }}
          LINT_GATES_SEL: ${{ needs.preflight.outputs.lint_gates != 'false' }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          check() { # <job> <result> <pr|code|scoped|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "${SCHEDULE_GUARD}" = proven ] && [ -n "${PROOF}" ] && [ "$3" != nightly ]; then
                  echo "SKIP $1 (tree proven by run ${PROOF})"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                elif [ "$3" = scoped ] && [ "${LINT_GATES_SEL}" != true ]; then
                  echo "SKIP $1 (no changed file matches LINT_GATES_PATTERN)"
                elif [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          # v1.30: a refused run (a dispatch off main, a checkpoint-branch PR) fails.
          if [ "${SCHEDULE_GUARD}" = refused ]; then
            echo "FAIL schedule-guard (refused: a workflow_dispatch off main or a PR from lane-ckpt/*; see its log)"; BAD=1
          fi
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr. v1.30: a job
          # that skips on a docs-only PR is code, and lint-gates is scoped.
          check preflight   "${{ needs.preflight.result }}" pr
          check lint        "${{ needs.lint.result }}" pr
          check image       "${{ needs.image.result }}" code
          check lint-gates  "${{ needs.lint-gates.result }}" scoped
          check integration "${{ needs.integration.result }}" code
          check soak        "${{ needs.soak.result }}" nightly
          check fips        "${{ needs.fips.result }}" full
          check tpm-swtpm   "${{ needs.tpm-swtpm.result }}" full
          check optee       "${{ needs.optee.result }}" full
          exit $BAD
