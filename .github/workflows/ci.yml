# CI for go-enclave.
#
# The pipeline is STAGED and fails fast by ordering rather than by
# cancellation: a fast tier (lint + build) gates the expensive tier (security
# and tests). A broken push reports in minutes and burns nothing downstream; a
# green push pays one fast tier of extra latency. The final gate distinguishes
# a SKIPPED stage (an upstream stage failed) from a FAILED one, and fails
# closed on either.
#
# Long-horizon checks — FIPS-strict test runs and vulnerability scanning — live
# in nightly.yml rather than on the push path, so that a slow or known-red job
# cannot burn an hour of runner time per push to tell us something we already
# know.
#
# Three things here are the result of being burned, and are worth understanding
# before editing:
#
#   * gosec and govulncheck TRIAGE THEIR OWN EXIT CODES. A shell reports a
#     signal death as 128+N, so a process killed by the OOM killer exits 137 —
#     indistinguishable, in a job summary, from a real security finding. Both
#     steps still exit non-zero either way; they only say WHICH it was. Without
#     it, an OOM-killed scanner reads as "reachable vulnerabilities" and sends
#     someone hunting a CVE that does not exist.
#
#   * gosec runs with BOUNDED CONCURRENCY. It sizes its worker pool from
#     runtime.NumCPU(), which reports the host's cores regardless of GOMAXPROCS
#     or of any cgroup limit the container is under — so on a large host in a
#     small container it grows live analysis state past the memory cap. Live
#     heap cannot be collected away; only lowering analysis concurrency shrinks
#     it.
#
#   * NEVER add `GOPROXY: direct` or `GOSUMDB: off` to the env block. The
#     blanket override disables checksum-database verification for every
#     third-party dependency, and breaks the build the moment an upstream
#     re-points a tag.
#
# Some steps are guarded on `github.server_url` so host-specific tooling runs
# only where it exists.

name: CI

on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
  workflow_dispatch:                  # re-fire the workflow by hand; also
                                      # the only retry when a run was
                                      # never created in the first place

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.27.0"        # portfolio standard (owner ruling 2026-09-01). The
                              # ci-runner image seeds this into the toolcache and
                              # the review image runs it with GOTOOLCHAIN=local, so
                              # both halves of the bump are in place -- raising the
                              # go directive alone would break the hosted review.
  COVERAGE_THRESHOLD: 90      # minimum total statement coverage

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "Files not formatted:"; echo "${UNFORMATTED}"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # USE THE BAKED TOOL; DO NOT INSTALL OVER THE NETWORK.
      #
      # This step used to `go install golangci-lint@v2.12.2` unconditionally,
      # which OVERWROTE the v2.13.2 the runner image bakes -- and v2.12.2 cannot
      # lint Go 1.27, so the workflow actively undid the fix that was already
      # sitting in the image. A sample of 12 repos found 9 in that state.
      #
      # It fails CLOSED on absence or a version mismatch rather than falling
      # back to a network install. A fallback reintroduces the substitution at
      # exactly the moment the image is wrong, which is the moment the guard
      # exists for -- and a linter silently downgraded is a gate that reports
      # green while checking less.
      - name: Require the pinned golangci-lint
        env:
          WANT: v2.13.2
        run: |
          set -eu
          if ! command -v golangci-lint >/dev/null 2>&1; then
            echo "::error::golangci-lint is not present in the image. It is baked" \
                 "at $WANT; this job does not install it over the network." >&2
            exit 1
          fi
          # Parse by this tool's OWN marker, not "the first version on the
          # line". The real output is
          #   golangci-lint has version 2.13.2 built with go1.26.7 from ...
          # which carries TWO versions, and the Go one is a different fact. A
          # positional parse happens to work today and breaks silently the day
          # the wording changes -- which is how the first draft of this step
          # shipped a check that read the Go version instead of the scanner's.
          got=$(golangci-lint --version 2>&1 | sed -n 's/.*has version \([0-9][^ ]*\).*/\1/p' | head -1)
          case "$got" in
            v*) ;;
            "") ;;
            *) got="v$got" ;;
          esac
          echo "golangci-lint present: $got (pinned $WANT)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::golangci-lint $got does not match the pin $WANT." \
                 "Raise the pin here and in the runner image together, or the" \
                 "linter and the toolchain drift apart." >&2
            exit 1
          fi

      # .golangci.yml must enable staticcheck, errcheck, unused, ineffassign,
      # misspell, gocritic — the umbrella with the security
      # linters off does not satisfy the gate.
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST: gated on the fast tier like test — a push that
    # cannot lint or build should not spend a heavy gosec/govulncheck pass.
    needs: [lint, build]
    # THE GO TOOLCHAIN IS CGROUP-UNAWARE. Inside a job container capped at
    # 16 GB, `nproc` still reports the host's core count and /proc/meminfo still
    # reports the host's memory, because both come from the HOST. Consequences,
    # measured against a live gosec run (cgroup memory.stat):
    #   - gosec defaults its worker count to NumCPU, so it ran 24 concurrent
    #     analyzers, each holding package ASTs/SSA.
    #   - Go's GC, with GOGC=100 and no GOMEMLIMIT, lets the heap roughly double
    #     before collecting and has no reason to stop short of what it believes
    #     is a 94 GB machine.
    # The heap blew past the 16 GB cgroup cap: memory.current 15.78 GB pinned at
    # the limit, memory.swap.current 10.93 GB, memory.events "max" 19440, and
    # anon 14.90 GB. Because the memory is ANONYMOUS, the kernel's only reclaim
    # path is swap — and because swap absorbed it, oom_kill stayed 0, so it
    # never failed fast. It just thrashed: host memory PSI 98, io PSI 98, 43% of
    # all CPU in iowait, dragging every other job on the box down with it. The
    # host had 56 GB FREE the whole time; the cap is per-cgroup, so more RAM
    # would have changed nothing.
    #
    # GOMEMLIMIT makes the GC treat the container's budget as real and collect
    # instead of growing. GOMAXPROCS cuts gosec's worker count, which is the
    # other multiplier. Keep GOMEMLIMIT comfortably BELOW the container cap —
    # it is a soft limit and non-heap memory lives outside it.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # USE THE BAKED TOOL; DO NOT INSTALL OVER THE NETWORK. This was
      # `go install ...@latest`, which is worse than a wrong pin: it is
      # unreproducible, it changes underneath the repo without a commit, and it
      # once made scans report "Version: dev" (go-luks2 #21). The image bakes a
      # pinned build and verifies it at build time.
      - name: Require the pinned gosec
        env:
          WANT: v2.29.0
        run: |
          set -eu
          if ! command -v gosec >/dev/null 2>&1; then
            echo "::error::gosec is not present in the image. It is baked at $WANT;" \
                 "this job does not install it over the network." >&2
            exit 1
          fi
          # "Version: v2.29.0" in the image. A gosec built by `go install`
          # reports "Version: dev" instead, because the version is injected with
          # -ldflags at image build time -- and "dev" is precisely what this pin
          # must reject, since an unversioned scanner is an unreproducible one.
          got=$(gosec --version 2>&1 | sed -n 's/^Version: //p' | head -1)
          case "$got" in v*) ;; "") ;; *) got="v$got" ;; esac
          echo "gosec present: $got (pinned $WANT)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::gosec $got does not match the pin $WANT. Raise the pin" \
                 "here and in the runner image together." >&2
            exit 1
          fi

      - name: Run gosec
        # -stdout keeps the findings readable in the job log: the SARIF upload
        # below only runs on github.com, so without it a Gitea failure exits 1
        # with the findings buried in an artifact nobody can see.
        # -concurrency 4 is the part of the memory bound that actually works
        #. GOMAXPROCS does NOT shrink gosec's footprint:
        # gosec sizes its worker pool from runtime.NumCPU(), which reports the
        # HOST's physical cores (24) regardless of GOMAXPROCS, so it analyzed
        # 24 packages' SSA simultaneously and the LIVE heap alone exceeded the
        # 16 GB container cap — GOMEMLIMIT cannot collect live memory, verified
        # on three concurrent scans all carrying GOMEMLIMIT=10GiB at 16/16 GiB.
        # Memory scales with concurrent package analysis; 4 bounds it.
        #
        # Exit code triaged as in the govulncheck step below: -concurrency
        # bounds gosec's footprint but does not make a kill impossible when
        # siblings crowd the host, and a bare 137 reads as "findings" when the
        # log holds none. Fail-closed either way.
        run: |
          set +e
          gosec -concurrency 4 -fmt=sarif -out=gosec.sarif -stdout -verbose=text -exclude-dir=test -exclude-dir=examples -severity=medium -confidence=medium ./...
          rc=$?
          set -e
          if [ "$rc" -gt 128 ]; then
            echo "::error::gosec was KILLED by signal $((rc - 128)) — this is NOT a security finding."
            echo "Memory pressure in the job container. Re-run when the host is quieter."
          fi
          exit "$rc"

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # USE THE BAKED TOOL; DO NOT INSTALL OVER THE NETWORK. This was
      # `go install ...@latest`, which is worse than a wrong pin: it is
      # unreproducible, it changes underneath the repo without a commit, and it
      # once made scans report "Version: dev" (go-luks2 #21). The image bakes a
      # pinned build and verifies it at build time.
      - name: Require the pinned govulncheck
        env:
          WANT: v1.7.0
        run: |
          set -eu
          if ! command -v govulncheck >/dev/null 2>&1; then
            echo "::error::govulncheck is not present in the image. It is baked at $WANT;" \
                 "this job does not install it over the network." >&2
            exit 1
          fi
          # `govulncheck -version` prints a "Go: go1.27.0" line as well as
          # "Scanner: govulncheck@v1.7.0", and WHICH COMES FIRST depends on how
          # the binary was built -- Scanner first in the runner image, Go first
          # from a `go run`. Taking the first version on the output read the Go
          # toolchain and compared it to the scanner pin.
          got=$(govulncheck -version 2>&1 | sed -n 's/^Scanner: govulncheck@//p' | head -1)
          case "$got" in v*) ;; "") ;; *) got="v$got" ;; esac
          echo "govulncheck present: $got (pinned $WANT)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::govulncheck $got does not match the pin $WANT. Raise the pin" \
                 "here and in the runner image together." >&2
            exit 1
          fi

      # `govulncheck ./...` renders that as an ordinary red with no findings in
      # the log, which reads exactly like "vulnerabilities found" and sends
      # someone hunting a CVE that does not exist. Observed in practice: gosec
      # reported `Issues : 0`, govulncheck was SIGKILLed in a memory-capped
      # container while heavy jobs ran alongside it on the same host, and
      # the Makefile called it "reachable vulnerabilities". govulncheck holds
      # the whole package graph and its SSA live, so the GOMEMLIMIT remedy
      # cannot help — GOMEMLIMIT does not collect LIVE memory.
      # Fail-closed either way: this still exits non-zero. It only says which.
      - name: Run govulncheck
        run: |
          set +e
          govulncheck ./...
          rc=$?
          set -e
          if [ "$rc" -gt 128 ]; then
            echo "::error::govulncheck was KILLED by signal $((rc - 128)) — this is NOT a vulnerability finding."
            echo "Memory pressure in the job container, not a CVE. Re-run when the host is quieter."
            echo "Confirm locally with an uncapped 'govulncheck ./...' before treating it as a finding."
          fi
          exit "$rc"

      - name: Verify module integrity
        run: go mod verify


  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build ./...

      # a repo with nested modules builds each.

  # FIPS gate (owner mandate 2026-08-17, security-review.md §6): every
  # project must build and pass unit tests with Go's native FIPS 140-3
  # mode enabled. GOFIPS140=latest selects the newest validated Go Crypto
  # Module snapshot at build time; the fips140=only GODEBUG rejects non-approved
  # algorithms at runtime, so non-approved primitives on exercised paths
  # fail HERE instead of in a customer's regulated environment. A primitive
  # that cannot pass is an owner-visible decision issue, never a silent
  # substitution.

  test:
    name: Test
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST: the expensive tier
    # starts only when the fast tier (lint+build, ~minutes) is green, so a
    # broken push reports in minutes and burns nothing downstream — Gitea has
    # no cancel API, so fail-fast can only come from ordering.
    # This supersedes an earlier lint-decoupling: that fix targeted a SILENT
    # skip masquerading as test failure; the
    # outage class is now closed at the source (linter pinned) and the gate
    # below reports skipped-because-upstream-failed distinctly, so a blocked
    # test run is loud, attributed, and fail-closed — not silent.
    needs: [lint, build]
    timeout-minutes: 30       # give the suite honest headroom
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # repo-specific environment tuning goes here (e.g. QUIC UDP
      # buffer sysctls). Note job containers may have a read-only /proc/sys —
      # tune the runner HOST for settings that matter; with host networking
      # the host's values apply.

      # -race IS NOT OPTIONAL. It is the sole detector for the
      # publication-ordering defect class in the shutdown registry: measured
      # 10/10 against the restored defect with the detector on, 0/10 with it
      # off. Removing the flag to speed this job up would retire that
      # guarantee silently — every test would still pass.
      #
      # -cpu=1,2,8 IS NOT OPTIONAL EITHER, and for the mirror-image reason
      # (#61). One direction of the retune/admission race — a lowering that
      # takes the contested page while `reserve` is between its read of the
      # headroom counter and the compare-and-swap that acts on it — has no test
      # seam and cannot get one: the seam would sit on the lock-free admission
      # path this type exists to keep free of branches and syscalls (benchmarked
      # in #49). It is caught by CONTENTION instead, so how reliably it is caught
      # is a property of the RUNNER, not of the suite — and a runner's core count
      # is not something this repo controls. The list makes a multi-core run
      # happen even on a single-core or heavily-pinned runner.
      #
      # Measured on an 8-core host against `reserve` regressed to
      # read-then-subtract, 10 runs of the whole package at each setting, this
      # command's exact flags:
      #     -cpu=1  ->  0/10 killed the mutant   (single core CANNOT see it)
      #     -cpu=2  ->  6/10
      #     -cpu=8  -> 10/10
      # So -cpu=1 alone is blind to it and the default (GOMAXPROCS = whatever the
      # runner has) is a coin toss on a small runner. Do not trim the list to one
      # value to save time; 8 is what makes the kill reliable and 1 is what keeps
      # the few-core paths honest.
      #
      # Cost, measured on the same host: 74s -> 195s for this step (2.6x, not 3x
      # — the coverage-instrumented build dominates). That is ~3.3 min against
      # this job's 30-minute timeout.
      - name: Run tests with coverage
        run: |
          go test -race -count=1 -cpu=1,2,8 -timeout=900s -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) -eq 1 ]; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

  # a repo that builds container images adds an `image` job here that
  # builds each image and gates it with `trivy image --severity CRITICAL,HIGH
  # --exit-code 1` BEFORE any push to either registry. Never
  # image-scan the devcontainer into code scanning.

  # The single required check. Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # trivy and fips live in nightly.yml, off the push path; they gate
    # nothing here.
    needs: [lint, security, build, test]
    steps:
      - name: Fail closed on any non-success
        run: |
          # skipped ≠ failed, but BOTH fail the gate: a skipped job means an
          # upstream gate failed (staged fail-fast), and naming it prevents
          # a red that looks like a test failure while tests never ran.
          check() { case "$2" in
            success) echo "OK   $1";;
            skipped) echo "SKIP $1 (upstream stage failed — see its job)"; BAD=1;;
            *)       echo "FAIL $1 ($2)"; BAD=1;;
          esac; }
          BAD=0
          check lint     "${{ needs.lint.result }}"
          check security "${{ needs.security.result }}"
          check build    "${{ needs.build.result }}"
          check test     "${{ needs.test.result }}"
          exit $BAD
