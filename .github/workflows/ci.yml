# CI for go-enclave.
#
# EVERY JOB IS ONE MAKE LINE (#89, #129; handbook devops §4: "the Makefile is
# the contract"). This file decides WHERE and IN WHAT ORDER checks run; the
# Makefile decides WHAT they are — commands, flags, pinned tool versions and
# the coverage floor — and groups them into the ci-lint, ci-security, ci-build,
# ci-test and ci-integration aggregates that release.yml calls too. A red job
# here reproduces locally with the same `make` line, and a check cannot pass in
# one place and fail in the other because the two were spelled differently.
# Why each check exists is documented beside its Makefile target and its test.
#
# Every job starts at once, so a run takes as long as its slowest job. CI Gate,
# the one required check, needs every job and fails closed on any result but
# success. automerge.yml's merge trains are PRs from merge-train/* and get
# their CI from the pull_request trigger like any PR.
#
# Jobs run on the bare runner (devops §1, §9): `runs-on: ubuntu-latest` plus
# actions/setup-go at the version go.mod declares. The devcontainer is for the
# integration suite, which `make ci-integration` runs through compose.
#
# Things here that are the result of being burned, and are worth understanding
# before editing:
#
#   * TOOLS ARE NEVER NETWORK-INSTALLED ON OUR RUNNERS. TOOL_INSTALL=0 makes
#     every lint and security target require its tool on PATH at exactly the
#     pin in scripts/tool-pins.sh and fail closed otherwise. A workflow that
#     `go install`ed over a baked golangci-lint once replaced it with a
#     version that cannot lint Go 1.27, `@latest` installs produced
#     unattributable "Version: dev" scans (go-luks2 #21), and the installs
#     themselves failed whenever sum.golang.org was unreachable. The pins track
#     each tool's latest upstream release; a mismatch is fixed by raising the
#     pin, never by installing over it. On github.com there is no baked image,
#     so the same targets install the same pins into the workspace
#     (TOOL_INSTALL=1).
#
#   * ACTIONLINT IS THE ONE EXCEPTION: scripts/tool.sh ignores TOOL_INSTALL=0
#     for it and resolves it as under TOOL_INSTALL=1. An image copy at exactly
#     the pin is used; anything else is built at the pinned tag into bin/tools.
#     The runner image's copy is built from an untagged commit (a
#     pseudo-version), which the version check rightly refuses, so it is built
#     (#145, #146). `go install tool@tag` is verified by the Go checksum
#     database like every other module download; never loosen the version check
#     to accept the image's.
#
#   * gosec and govulncheck TRIAGE THEIR OWN EXIT CODES (in the Makefile). A
#     shell reports a signal death as 128+N, so a scanner killed by the OOM
#     killer exits 137 — indistinguishable, in a job summary, from a real
#     finding. The targets still fail either way; they only say WHICH.
#
#   * NEVER add `GOPROXY: direct` or `GOSUMDB: off` to an env block. The
#     blanket override disables checksum-database verification for every
#     third-party dependency, and breaks the build the moment an upstream
#     re-points a tag.
#
# Some steps are guarded on `github.server_url` so host-specific tooling runs
# only where it exists.
#
# Long-horizon checks — the FIPS-strict UNIT test run and `trivy fs` — live in
# nightly.yml rather than on the push path (devops §8a: alpha phase). The
# integration suite's FIPS run is the exception: it is on the push path, in
# `integration`. release.yml runs everything, trivy included, on a tag.

name: CI

on:
  push:
    branches: [main]                    # GitHub Flow: main is the only long-lived branch
  pull_request:
    branches: [main]
  workflow_dispatch:                  # re-fire the workflow by hand; also
                                      # the only retry when a run was
                                      # never created in the first place

# Read-only by default. Only the job that uploads SARIF (Security, on
# github.com) is granted security-events: write, at job level.
permissions:
  contents: read

env:
  # 0 on our runners: require the image's baked tools at the pins, install
  # nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  # make ci-lint: tidiness, gofmt, golangci-lint (vet, staticcheck, gosec),
  # actionlint with shellcheck over every run: block, shellcheck over the
  # scripts, the integration suite's lint (with its build tag), and the build
  # gates: action pins (#70), issue citations, the merge workflow, the public
  # releasability gate (#80), CHANGELOG assembly and the release scripts. The
  # Makefile and the tests under build/ci/buildgates say why each exists.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-lint

  security:
    name: Security
    runs-on: ubuntu-latest
    # THE GO TOOLCHAIN IS CGROUP-UNAWARE. Inside a job container capped at
    # 16 GB, `nproc` still reports the host's core count and /proc/meminfo still
    # reports the host's memory, because both come from the HOST. Consequences,
    # measured against a live gosec run (cgroup memory.stat):
    #   - gosec defaults its worker count to NumCPU, so it ran 24 concurrent
    #     analyzers, each holding package ASTs/SSA.
    #   - Go's GC, with GOGC=100 and no GOMEMLIMIT, lets the heap roughly double
    #     before collecting and has no reason to stop short of what it believes
    #     is a 94 GB machine.
    # The heap blew past the 16 GB cgroup cap: memory.current 15.78 GB pinned at
    # the limit, memory.swap.current 10.93 GB, memory.events "max" 19440, and
    # anon 14.90 GB. Because the memory is ANONYMOUS, the kernel's only reclaim
    # path is swap — and because swap absorbed it, oom_kill stayed 0, so it
    # never failed fast. It just thrashed: host memory PSI 98, io PSI 98, 43% of
    # all CPU in iowait, dragging every other job on the box down with it. The
    # host had 56 GB FREE the whole time; the cap is per-cgroup, so more RAM
    # would have changed nothing.
    #
    # GOMEMLIMIT makes the GC treat the container's budget as real and collect
    # instead of growing. GOMAXPROCS bounds the Go runtime's parallelism; it
    # does NOT shrink gosec's worker pool (sized from NumCPU), which is why
    # `make gosec` passes -concurrency=4 — that flag is the part of the memory
    # bound that actually works, verified on three concurrent scans all
    # carrying GOMEMLIMIT=10GiB at 16/16 GiB. Keep GOMEMLIMIT comfortably BELOW
    # the container cap — it is a soft limit and non-heap memory lives outside
    # it, and it cannot collect LIVE memory, which is why govulncheck (whole
    # package graph and SSA live) can still be killed when siblings crowd the
    # host; its exit is triaged for exactly that.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    permissions:
      contents: read
      security-events: write  # the gosec SARIF upload on github.com; unused on Gitea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # gosec writes gosec.sarif and prints the same findings as text, so a
      # Gitea failure (no code-scanning API) shows them in the log; then
      # govulncheck and module verification.
      - run: make ci-security

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  # Every supported GOOS/GOARCH, 32-bit included: providertest did not compile
  # on linux/386 or linux/arm through v0.6.1-alpha and nothing noticed, because
  # nothing built it there. The target list lives in the Makefile so a local
  # `make ci` and this job cannot disagree.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-build

  # FIPS (owner mandate 2026-08-17, security-review.md §6) runs nightly
  # (nightly.yml -> `make test-fips`), not here; moving it onto the push path
  # is a deliberate decision, not a drive-by.

  # make ci-test runs the suite with TESTFLAGS (-race -count=1 -cpu=1,2,8) and
  # FAILS below the Makefile's COVERAGE_THRESHOLD, then the erasing build
  # (GOEXPERIMENT=runtimesecret, #98).
  #
  # -race IS NOT OPTIONAL. It is the sole detector for the publication-ordering
  # defect class in the shutdown registry: measured 10/10 against the restored
  # defect with the detector on, 0/10 with it off. -cpu=1,2,8 IS NOT OPTIONAL
  # EITHER (#61): the retune/admission race is caught only by CONTENTION, so how
  # reliably it is caught is a property of the RUNNER's core count, which this
  # repo does not control; the list makes a multi-core run happen on any runner.
  # Measured against `reserve` regressed to read-then-subtract: -cpu=1 killed
  # the mutant 0/10, -cpu=2 6/10, -cpu=8 10/10. Do not trim the list to save
  # time: the cost is ~3.3 min against this job's 30-minute timeout.
  #
  # Repo-specific environment tuning goes here (e.g. QUIC UDP buffer sysctls).
  # Note job containers may have a read-only /proc/sys — tune the runner HOST
  # for settings that matter; with host networking the host's values apply.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30       # give the suite honest headroom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: make ci-test

  # a repo that builds container images adds an `image` job here that
  # builds each image and gates it with `trivy image --severity CRITICAL,HIGH
  # --exit-code 1` BEFORE any push to either registry. Never
  # image-scan the devcontainer into code scanning.

  # THE INTEGRATION SUITE (#91), in the hardened `integration` image of the
  # project devcontainer, never on the runner itself — exactly the `make`
  # target a developer runs. The suite drives the public API against the real
  # kernel: admission under a real RLIMIT_MEMLOCK ceiling, core-dump exclusion
  # and mlock read back from /proc/self/smaps, plaintext residue swept from
  # /proc/self/mem, sealing in both modes, and the shutdown sweep.
  #
  # Docker is a HARD requirement and is never skipped around: the targets fail,
  # naming what is missing, when `docker`, Compose v2 or a reachable daemon is
  # absent, and the suite's TestMain refuses to run in a container whose
  # capabilities, memlock/core limits or FIPS state differ from what
  # compose.yaml declares. A gate that passed without running would gate
  # nothing.
  #
  # On our Gitea runners `docker compose` reaches the HOST daemon through the
  # socket act_runner mounts into job containers (docker-outside-of-docker). The
  # integration image therefore bakes the source in — the build context is sent
  # by the client — and bind-mounts nothing from the job's filesystem, which on
  # a runner would resolve on the host, where the checkout does not exist. Each
  # run is its own compose project (unique name: time, pid, random bytes) and is
  # torn down with its volume and image on exit, so concurrent jobs on one host
  # cannot collide (integration-testing §7).
  #
  # Both FIPS configurations run (`make ci-integration`), one after the other:
  # the default, and FIPS 140-3 strict (GOFIPS140=latest, GODEBUG=fips140=only),
  # which the suite verifies actually took effect (crypto/fips140.Enabled/
  # Enforced). The image is trivy-scanned once (both runs use the same image).
  # trivy is not on the runner host, so it is copied out of the toolchain image,
  # which carries it at the pin in scripts/tool-pins.sh; nothing is downloaded.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Pinned trivy from the toolchain image
        run: |
          set -eu
          sh build/ci/toolchain-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: make ci-integration

  # The single required check. Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # trivy and the UNIT-test FIPS run live in nightly.yml, off the push
    # path; they gate nothing here. The integration suite's FIPS run is part
    # of `integration` and gates.
    needs: [lint, security, build, test, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail closed on any non-success
        run: |
          sh build/ci/summary.sh "a CI job did not pass" \
            lint="${{ needs.lint.result }}" \
            security="${{ needs.security.result }}" \
            build="${{ needs.build.result }}" \
            test="${{ needs.test.result }}" \
            integration="${{ needs.integration.result }}"
