# automerge v6: a PR merges itself once CI is green; a `code-review` PR also
# needs one approval from the reviewer list, by someone other than its author.
# PRs that are behind main land in batches through a merge train.
#
# Owner rulings (automatethethings#200, #203; go-enclave#118):
#   2026-10-04 "yes lets batch the merges. make sure we are doing things
#    efficiently!" and "use merge trains where possible if that helps!"
#   2026-10-04 "instead of using review-bypass, lets use the existing
#    code-review label. if the label is there, then we require the
#    review/approval, otherwise it can automerge."
#   2026-10-02 the approvers: claude, codex, opencode, jeremyhahn,
#    agent-company, agent-software.
#   2026-10-01 "quicbaas is going to be responsible for running the code review
#    agents instead of gitea. we only want standard actions in gitea"
#   2026-10-01 "make sure that the automerge squashes and deletes the remote
#    branch, we dont want to leave dangling branches"
#
#   no `code-review` label -> ready when every required CI check is green
#   `code-review` label    -> ready when CI is green AND, on the current head,
#                             one APPROVED review (not stale, not dismissed) by
#                             one of APPROVERS other than the PR's author, and
#                             no reviewer's latest review is REQUEST_CHANGES
#
# BASE-DEFINED ONLY. AGENT_TOKEN reaches only runs whose definition Gitea takes
# from the base branch: pull_request_target, workflow_run and schedule. A
# `pull_request` or `pull_request_review` run is defined by the PR head, so a PR
# could rewrite the merge decision; neither is a trigger here. Reviews have no
# base-defined event on Gitea, so the schedule sweeps open PRs for them.
#
# RESIDUAL RISK. "Green" is the required statuses, and ci.yml (which posts
# them) runs from the PR head, so an unlabelled PR that rewrites ci.yml can
# post its own green; `code-review` is the control for such a PR. Gitea also
# hands repository secrets to same-repo `pull_request` runs, so anyone who can
# push a branch can read AGENT_TOKEN through a new workflow; closing that needs
# the token held outside repository secrets.
#
# Branch protection requires 0 approvals: Gitea cannot make an approval
# conditional on a label, so this workflow is that gate. QuicBaaS posts the
# reviews; this workflow only reads them.
#
# NO MERGE IS EVER SCHEDULED. Every merge call is made immediately after this
# run has read CI, the label and the reviews, and is pinned to the head commit
# whose checks were read; squash, then delete the head branch. Every run also
# cancels any merge a legacy workflow armed.
#
# FAIL CLOSED: nothing merges unless the base branch REQUIRES at least one
# status check and every required context is `success` on the PR head.
#
# MERGE TRAIN (sweeps: schedule and workflow_run). Ready PRs into main, in PR
# number order:
#   - a train in flight whose CI is pending -> wait (one train at a time);
#   - main moved, or a train PR changed or is no longer ready -> delete the
#     train and build a new one;
#   - train CI green -> squash-merge its PRs in order, delete the train, and
#     fail the run if main's tree is not the train's;
#   - train CI red -> comment on its PRs, delete it, rebuild without the
#     newest; a one-PR train that fails is left to its author until its head
#     changes;
#   - otherwise a ready PR already on main's tip merges directly, and the rest
#     are merged (--no-ff, conflicts skipped with a comment) onto main as a new
#     branch merge-train/<epoch>-<run id>, whose head commit records the base
#     and every PR head. ci.yml runs on that push.
# A train branch is pushed once and deleted, never force-updated. Its job
# fetches refs and merges them; it runs no PR code.
#
# BEHIND MAIN, v5 FALLBACK. While main has block_on_outdated_branch on, or if
# Gitea refuses a train merge as "behind the base branch", the PR gets Gitea's
# update-branch call instead (style merge, never a rebase) and merges on its
# own green CI.
#
# The merge is made as the repository's own agent (AGENT_TOKEN), one of the
# principals on the merge whitelist (infra/gitea/scripts/setup-repo-guardrails.sh).
name: Auto Merge

on:
  # Never `pull_request` or `pull_request_review`: see BASE-DEFINED ONLY. This
  # job never checks out the PR.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    # The repository's CI workflow; the documentation repos call theirs Docs.
    workflows: [CI, Docs]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'

# Runs queue rather than cancel, so a train is never cut off mid-landing where
# concurrency is honoured. Gitea may not honour it: see train() for the races.
concurrency:
  group: automerge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when CI is green (code-review PRs also need an approval)
    # A red train must still be seen, to drop its newest PR.
    if: >-
      github.server_url != 'https://github.com' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' ||
       startsWith(github.event.workflow_run.head_branch, 'merge-train/'))
    runs-on: ubuntu-latest
    steps:
      - name: Merge, hold, or wait
        env:
          BOT: ${{ secrets.AGENT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          EVENT: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          # The repository agent is agent-<repo> (agent-git.sh's format); the
          # token cannot read /user.
          AGENT_DOMAIN: example.internal
          TRAIN_BASE: main
          # A train with no CI result after this long is rebuilt.
          TRAIN_TIMEOUT_MIN: '120'
          # Gitea answers "try again later" while it re-tests a PR after main moved.
          RETRY_SLEEP: '3'
          # The reviewers whose approval releases a `code-review` PR (owner,
          # 2026-10-02). Logins, exact.
          APPROVERS: '["claude","codex","opencode","jeremyhahn","agent-company","agent-software"]'
        run: |
          set -euo pipefail

          # A blank token would make Gitea answer as an anonymous caller, which
          # reads as a permissions bug; it must never fall back to another token.
          [ -n "${BOT:-}" ] || {
            echo "::error::AGENT_TOKEN is not set on this repository; the merge is made as the project agent."
            exit 1; }
          api() { # method path [body] -> http code; body in /tmp/api.json
            curl -sS -o /tmp/api.json -w '%{http_code}' -X "$1" \
              -H "Authorization: token $BOT" -H 'Content-Type: application/json' \
              ${3:+-d "$3"} "$REPO_API$2"
          }
          die() { echo "::error::$*" >&2; exit 1; }
          paged() { # path out -> every page of a JSON-array endpoint, concatenated
            echo '[]' > "$2"
            local page=1 sep='?'
            case $1 in *\?*) sep='&' ;; esac
            while :; do
              code=$(api GET "$1${sep}limit=50&page=$page")
              [ "$code" = "200" ] || die "cannot read $1 (HTTP $code)"
              [ "$(jq 'length' /tmp/api.json)" -gt 0 ] || break
              jq -s '.[0] + .[1]' "$2" /tmp/api.json > "$2.next"
              mv "$2.next" "$2"
              page=$((page + 1))
            done
          }
          has_label() { # -> 0 when the PR carries code-review (one response, not paged)
            code=$(api GET "/issues/$pr/labels")
            [ "$code" = "200" ] || die "cannot read the labels of PR $pr (HTTP $code)"
            jq -e 'any(.[]; .name == "code-review")' /tmp/api.json >/dev/null
          }
          review_verdict() { # -> "approved <logins>" | changes | waiting, for $head
            paged "/pulls/$pr/reviews" /tmp/reviews.json
            # Only reviews ON THIS HEAD count, not stale and not dismissed; each
            # reviewer's latest decisive review is theirs. Any REQUEST_CHANGES
            # blocks; one APPROVED from APPROVERS, not the author, releases.
            jq -r --arg h "$head" --arg author "$author" --argjson ok "$APPROVERS" '
                [ .[] | select(.commit_id == $h and (.stale | not) and (.dismissed | not)
                               and (.state == "APPROVED" or .state == "REQUEST_CHANGES")) ]
                | group_by(.user.login) | map(max_by(.id))
                | [ .[] | select(.state == "APPROVED" and (.user.login | ascii_downcase) != $author
                                 and (.user.login as $u | $ok | index($u))) | .user.login ] as $by
                | ($by | join(", ")) as $names
                | if any(.[]; .state == "REQUEST_CHANGES") then "changes"
                  elif ($by | length) > 0 then "approved \($names)"
                  else "waiting" end' /tmp/reviews.json
          }
          ci_state() { # sha required.json -> success | failure | pending
            # The combined status carries the LATEST status per context; page
            # it to total_count.
            echo '[]' > /tmp/latest.json
            local page=1 total got
            while :; do
              code=$(api GET "/commits/$1/status?limit=50&page=$page")
              [ "$code" = "200" ] || die "cannot read the status of $1 (HTTP $code)"
              jq -s '.[0] + (.[1].statuses // [])' /tmp/latest.json /tmp/api.json > /tmp/latest.next
              mv /tmp/latest.next /tmp/latest.json
              total=$(jq -r '.total_count // 0' /tmp/api.json)
              got=$(jq 'length' /tmp/latest.json)
              { [ "$(jq '.statuses // [] | length' /tmp/api.json)" -gt 0 ] && [ "$got" -lt "$total" ]; } || break
              page=$((page + 1))
            done
            jq -r --slurpfile req "$2" '. as $l
                | [ $req[0][] as $c | ([ $l[] | select(.context == $c) ][0].status // "pending") ]
                | if length > 0 and all(. == "success") then "success"
                  elif any(. == "failure" or . == "error") then "failure"
                  else "pending" end' /tmp/latest.json
          }
          protection() { # base -> /tmp/required.json, /tmp/push_required.json, $block
            code=$(api GET "/branch_protections/$1")
            if [ "$code" != "200" ] || ! jq -e '.enable_status_check == true and ((.status_check_contexts // []) | length > 0)' /tmp/api.json >/dev/null; then
              die "$1 requires no status checks, so nothing would wait for CI. Not merging."
            fi
            jq -c '.status_check_contexts' /tmp/api.json > /tmp/required.json
            # A train is a push, so its CI reports the push variant of each context.
            jq -c '[ .status_check_contexts[] | sub(" \\(pull_request\\)$"; " (push)") ]' /tmp/api.json > /tmp/push_required.json
            block=$(jq -r '.block_on_outdated_branch == true' /tmp/api.json)
          }
          tip() { # branch -> its head commit
            code=$(api GET "/branches/$1")
            [ "$code" = "200" ] || die "cannot read branch $1 (HTTP $code)"
            jq -r '.commit.id' /tmp/api.json
          }
          trains() { # -> /tmp/trains.json: merge-train/* branches, oldest first
            paged "/branches" /tmp/branches.json
            jq '[ .[] | select(.name | startswith("merge-train/"))
                  | {name, sha: .commit.id, message: .commit.message,
                     born: ((.name | ltrimstr("merge-train/") | split("-")[0] | tonumber?) // 0)} ]
                | sort_by(.born, .name)' /tmp/branches.json > /tmp/trains.json
          }
          delete_branch() {
            code=$(api DELETE "/branches/$1")
            case "$code" in 204|404) ;; *) die "cannot delete $1 (HTTP $code): $(cat /tmp/api.json)" ;; esac
          }
          comment() { # pr text
            code=$(api POST "/issues/$1/comments" "$(jq -nc --arg b "$2" '{body: $b}')")
            case "$code" in 200|201) ;; *) die "cannot comment on PR $1 (HTTP $code)" ;; esac
            # Markers are trusted only from $me: a wrong $me would retry a
            # failing train forever, so say so loudly.
            [ "$(jq -r '.user.login' /tmp/api.json)" = "$me" ] ||
              die "comments are posted as $(jq -r '.user.login' /tmp/api.json), not $me: the train cannot recognise its own markers"
          }
          has_marker() { # pr marker -> 0 when this agent already left it
            # Gitea's issue-comments endpoint has no page/limit parameters and
            # returns every comment in one response.
            code=$(api GET "/issues/$1/comments")
            [ "$code" = "200" ] || die "cannot read the comments of PR $1 (HTTP $code)"
            jq -e --arg me "$me" --arg m "$2" 'any(.[]; .user.login == $me and (.body | contains($m)))' /tmp/api.json >/dev/null
          }
          squash() { # pr head -> http code; the merge is pinned to head
            local body try=0
            body=$(jq -nc --arg h "$2" '{Do: "squash", delete_branch_after_merge: true, head_commit_id: $h}')
            while :; do
              code=$(api POST "/pulls/$1/merge" "$body")
              { [ "$code" = "405" ] && grep -qi 'try again later' /tmp/api.json && [ "$try" -lt 10 ]; } || break
              try=$((try + 1))
              sleep "$RETRY_SLEEP"
            done
            echo "$code"
          }
          update_branch() { # pr base held: merge base into the PR (never a rebase)
            code=$(api POST "/pulls/$1/update?style=merge")
            [ "$code" = "200" ] || die "PR $1 is behind $2 and $2 could not be merged into it (HTTP $code): $(cat /tmp/api.json) -- merge $2 into the branch by hand."
            note=""
            [ "$3" = "1" ] && note=" (a code-review PR needs its approval again on the new head)"
            echo "PR $1 was behind $2: merged $2 into it; CI re-runs on the new head and merges it when green$note."
          }
          merge_or_update() { # pr head base held: v5
            code=$(squash "$1" "$2")
            case "$code" in
              200|201|204) echo "merged PR $1 ($2) into $3; branch deleted" ;;
              *)
                if [ "$code" = "405" ] && grep -q 'behind the base branch' /tmp/api.json; then
                  update_branch "$1" "$3" "$4"
                else
                  die "PR $1 is ready but did not merge (HTTP $code): $(cat /tmp/api.json)"
                fi ;;
            esac
          }

          # Is one PR ready? Runs in a subshell: `exit 0` is "not now",
          # non-zero is an error for that PR. Ready: appends
          # "pr head base merge_base held" to /tmp/ready.
          check() {
            pr=$1
            code=$(api GET "/pulls/$pr")
            [ "$code" = "200" ] || die "cannot read PR $pr (HTTP $code)"
            cp /tmp/api.json /tmp/pr.json
            [ "$(jq -r '.state' /tmp/pr.json)" = "open" ] || { echo "PR $pr is not open"; exit 0; }
            [ "$(jq -r '.draft' /tmp/pr.json)" != "true" ] || { echo "PR $pr is a draft; not merging"; exit 0; }
            head=$(jq -r '.head.sha' /tmp/pr.json)
            base=$(jq -r '.base.ref' /tmp/pr.json)
            mbase=$(jq -r '.merge_base // ""' /tmp/pr.json)
            author=$(jq -r '.user.login | ascii_downcase' /tmp/pr.json)
            protection "$base"

            # A merge armed by a legacy workflow (or a legacy copy still on an
            # old PR head) must not outlive it: 204 cancelled one, 404 there
            # was none.
            code=$(api DELETE "/pulls/$pr/merge")
            case "$code" in
              204) echo "cancelled a merge armed earlier by a legacy workflow" ;;
              404) ;;
              *)   die "an armed merge on PR $pr could not be cancelled (HTTP $code): $(cat /tmp/api.json)" ;;
            esac

            state=$(ci_state "$head" /tmp/required.json)
            [ "$state" = "success" ] || {
              echo "CI is not green on $head yet; CI finishing will run this again."
              exit 0; }

            # Read now, after CI, so neither the label nor the reviews can
            # change between the check and the merge call unseen.
            held=0
            if has_label; then
              held=1
              verdict=$(review_verdict)
              case "$verdict" in
                approved*) echo "code-review: approved on $head by ${verdict#approved }" ;;
                changes)   echo "code-review: changes requested on $head; not merging."; exit 0 ;;
                *)         echo "code-review: CI is green; waiting for an approval from one of $(jq -r 'join(", ")' <<<"$APPROVERS") other than $author on $head."; exit 0 ;;
              esac
            fi
            echo "PR $pr is ready on $head"
            echo "$pr $head $base $mbase $held" >> /tmp/ready
          }

          # Merges the PRs in /tmp/cands ("pr head merge_base held") onto
          # $base_tip as a new train branch. Fetches and merges refs only.
          build_train() {
            [ -s /tmp/cands ] || { echo "no PR is waiting for a train"; return 0; }
            local repo=/tmp/train-repo auth name msg n h ref specs=("+refs/heads/$TRAIN_BASE:refs/train/base")
            while read -r n _; do specs+=("+refs/pull/$n/head:refs/train/pr/$n"); done < /tmp/cands
            rm -rf "$repo"
            git init -q "$repo"
            # Config by environment keeps the token out of argv; no hooks run,
            # and the train is unprotected, so its commits are unsigned.
            auth=$(printf '%s:%s' "$me" "$BOT" | base64 -w0)
            export GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
              GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null \
              GIT_CONFIG_KEY_2=commit.gpgSign GIT_CONFIG_VALUE_2=false \
              GIT_AUTHOR_NAME="$me" GIT_AUTHOR_EMAIL="$me_email" \
              GIT_COMMITTER_NAME="$me" GIT_COMMITTER_EMAIL="$me_email"
            git -C "$repo" fetch -q --no-tags "$GIT_URL" "${specs[@]}" || die "cannot fetch $TRAIN_BASE and the PR heads"
            [ "$(git -C "$repo" rev-parse refs/train/base)" = "$base_tip" ] || {
              echo "$TRAIN_BASE moved while the train was being built; the next run builds it"; return 0; }
            git -C "$repo" checkout -q --detach refs/train/base
            : > /tmp/train_in
            while read -r n h _; do
              ref=refs/train/pr/$n
              [ "$(git -C "$repo" rev-parse "$ref")" = "$h" ] || { echo "PR $n moved since it was read; left for the next train"; continue; }
              if git -C "$repo" merge -q --no-ff -m "merge-train: #$n $h" "$ref" >/tmp/merge.log 2>&1; then
                echo "$n $h" >> /tmp/train_in
              else
                git -C "$repo" merge --abort
                echo "PR $n conflicts; left out of the train"
                if ! has_marker "$n" "<!-- merge-train:conflict $h -->"; then
                  comment "$n" "$(printf 'PR #%s (%s) does not merge cleanly onto %s (%s) together with the PRs ahead of it, so it was left out of the merge train. Merge %s into the branch and resolve the conflict.\n\n<!-- merge-train:conflict %s -->' "$n" "$h" "$TRAIN_BASE" "$base_tip" "$TRAIN_BASE" "$h")"
                fi
              fi
            done < /tmp/cands
            [ -s /tmp/train_in ] || { echo "no PR merged cleanly; no train"; return 0; }
            msg=$(printf 'merge-train: %s PR(s) onto %s\n\nbase %s\n' "$(wc -l < /tmp/train_in)" "$TRAIN_BASE" "$base_tip"
                  while read -r n h; do printf 'pr %s %s\n' "$n" "$h"; done < /tmp/train_in)
            git -C "$repo" commit -q --allow-empty -m "$msg"
            name="merge-train/$(date +%s)-$RUN_ID"
            git -C "$repo" push -q "$GIT_URL" "HEAD:refs/heads/$name" || die "cannot push $name"
            echo "built $name with PRs $(cut -d' ' -f1 /tmp/train_in | tr '\n' ' ')onto $base_tip; CI runs on it"
            # Two sweeps may race to build: the oldest train stays.
            trains
            first=$(jq -r '.[0].name' /tmp/trains.json)
            [ "$first" = "$name" ] || { delete_branch "$name"; echo "$first is already in flight; withdrew $name"; }
          }

          # The train step of a sweep, over the ready PRs in /tmp/cands.
          train() {
            local t_name t_sha t_born t_list state n h why count newest landed=""
            base_tip=$(tip "$TRAIN_BASE")
            trains
            for extra in $(jq -r '.[1:][].name' /tmp/trains.json); do
              echo "removing $extra: only one train runs at a time"; delete_branch "$extra"
            done
            if [ "$(jq 'length' /tmp/trains.json)" -gt 0 ]; then
              t_name=$(jq -r '.[0].name' /tmp/trains.json)
              t_sha=$(jq -r '.[0].sha' /tmp/trains.json)
              t_born=$(jq -r '.[0].born' /tmp/trains.json)
              jq -r '.[0].message' /tmp/trains.json | sed -n 's/^pr \([0-9][0-9]*\) \([0-9a-f]\{40\}\)$/\1 \2/p' > /tmp/train_prs
              t_list=$(cut -d' ' -f1 /tmp/train_prs | paste -sd' ')
              why=""
              [ "$(jq -r '.[0].message' /tmp/trains.json | sed -n 's/^base //p')" = "$base_tip" ] || why="$TRAIN_BASE moved since it was built"
              [ -s /tmp/train_prs ] || why="it records no PRs"
              while read -r n h; do
                awk -v n="$n" -v h="$h" '$1 == n && $2 == h { f = 1 } END { exit !f }' /tmp/cands || why="PR $n changed or is no longer ready"
              done < /tmp/train_prs
              if [ -n "$why" ]; then
                echo "abandoning $t_name: $why"; delete_branch "$t_name"
              else
                state=$(ci_state "$t_sha" /tmp/push_required.json)
                if [ "$state" = "pending" ] && [ $(( $(date +%s) - t_born )) -gt $((TRAIN_TIMEOUT_MIN * 60)) ]; then
                  echo "::warning::$t_name has no CI result after $TRAIN_TIMEOUT_MIN minutes; rebuilding it"
                  delete_branch "$t_name"
                  state=abandoned
                fi
                case "$state" in
                  pending)
                    echo "$t_name (PRs $t_list) is waiting for CI on $t_sha"
                    return 0 ;;
                  success)
                    echo "$t_name is green on $t_sha; landing its PRs in order"
                    cp /tmp/train_prs /tmp/landing
                    while read -r n h; do
                      code=$(squash "$n" "$h")
                      case "$code" in
                        200|201|204) echo "merged PR $n ($h) into $TRAIN_BASE; branch deleted"; landed="$landed $n" ;;
                        *)
                          if [ "$code" = "405" ] && grep -q 'behind the base branch' /tmp/api.json; then
                            echo "::warning::$TRAIN_BASE still requires up-to-date branches; PR $n and the rest of $t_name fall back to update-branch"
                            delete_branch "$t_name"
                            awk -v n="$n" 'f || $1 == n { f = 1; print $1 }' /tmp/train_prs > /tmp/fallback
                            while read -r n; do
                              update_branch "$n" "$TRAIN_BASE" "$(awk -v n="$n" '$1 == n { print $4 }' /tmp/cands)"
                            done < /tmp/fallback
                            return 0
                          fi
                          delete_branch "$t_name"
                          die "PR $n in $t_name did not merge (HTTP $code): $(cat /tmp/api.json); the train is abandoned" ;;
                      esac
                    done < /tmp/landing
                    base_tip=$(tip "$TRAIN_BASE")
                    code=$(api GET "/git/commits/$base_tip"); [ "$code" = "200" ] || die "cannot read $base_tip (HTTP $code)"
                    main_tree=$(jq -r '.commit.tree.sha' /tmp/api.json)
                    code=$(api GET "/git/commits/$t_sha"); [ "$code" = "200" ] || die "cannot read $t_sha (HTTP $code)"
                    if [ "$main_tree" != "$(jq -r '.commit.tree.sha' /tmp/api.json)" ]; then
                      delete_branch "$t_name"
                      die "$TRAIN_BASE ($base_tip) does not have the tree $t_name was tested on ($t_sha); $TRAIN_BASE's own CI is the backstop"
                    fi
                    delete_branch "$t_name"
                    echo "landed $t_name and deleted it"
                    awk -v l="$landed " 'index(" " l, " " $1 " ") == 0' /tmp/cands > /tmp/cands.next; mv /tmp/cands.next /tmp/cands ;;
                  failure)
                    count=$(wc -l < /tmp/train_prs)
                    newest=$(tail -n 1 /tmp/train_prs | cut -d' ' -f1)
                    delete_branch "$t_name"
                    while read -r n h; do
                      if [ "$count" = "1" ]; then
                        comment "$n" "$(printf 'Merge train %s failed CI with this PR alone on %s (%s): see the CI run for %s. The train leaves this PR to its author until its head changes.\n\n<!-- merge-train:failed %s -->' "$t_name" "$TRAIN_BASE" "$base_tip" "$t_sha" "$h")"
                      else
                        comment "$n" "$(printf 'Merge train %s (PRs %s) failed CI on the combined tree %s. Retrying without the newest, #%s.' "$t_name" "$t_list" "$t_sha" "$newest")"
                      fi
                    done < /tmp/train_prs
                    if [ "$count" = "1" ]; then
                      echo "$t_name failed CI; PR $newest is left to its author"
                    else
                      echo "$t_name failed CI; retrying without PR $newest"
                    fi
                    awk -v n="$newest" '$1 != n' /tmp/cands > /tmp/cands.next; mv /tmp/cands.next /tmp/cands ;;
                esac
              fi
            fi

            # A ready PR already on the tip was tested on exactly the tree a
            # squash produces: merge it directly.
            read -r n h _ held < <(awk -v t="$base_tip" '$3 == t' /tmp/cands; echo) || true
            if [ -n "${n:-}" ]; then
              merge_or_update "$n" "$h" "$TRAIN_BASE" "$held"
              awk -v n="$n" '$1 != n' /tmp/cands > /tmp/cands.next; mv /tmp/cands.next /tmp/cands
              base_tip=$(tip "$TRAIN_BASE")
            fi
            build_train
          }

          : > /tmp/ready
          failed=0
          # Not `( cmd ) || ...`: bash ignores errexit inside a subshell run
          # in a condition. An error fails the run but not the sweep.
          guard() {
            set +e
            ( set -e; "$@" )
            rc=$?
            set -e
            [ "$rc" = "0" ] || failed=1
          }
          one() {
            echo "::group::PR $1"
            set +e
            ( set -e; check "$1" )
            rc=$?
            set -e
            [ "$rc" = "0" ] || failed=1
            echo "::endgroup::"
          }

          case "$EVENT" in
            pull_request_target)
              # One PR: merge it now only when no train would be disturbed.
              one "$PR_FROM_EVENT"
              if read -r pr head base mbase held < /tmp/ready; then
                protection "$base"
                trains
                if [ "$base" != "$TRAIN_BASE" ] || [ "$block" = "true" ]; then
                  merge_or_update "$pr" "$head" "$base" "$held"
                elif [ "$mbase" = "$(tip "$base")" ] && [ "$(jq 'length' /tmp/trains.json)" = "0" ]; then
                  merge_or_update "$pr" "$head" "$base" "$held"
                else
                  echo "PR $pr is ready but behind $base or a train is in flight; the next sweep puts it on a merge train"
                fi
              fi ;;
            workflow_run|schedule)
              paged "/pulls?state=open" /tmp/open.json
              for n in $(jq -r '.[].number' /tmp/open.json | sort -n); do one "$n"; done
              protection "$TRAIN_BASE"
              : > /tmp/cands
              while read -r pr head base mbase held; do
                if [ "$base" != "$TRAIN_BASE" ] || [ "$block" = "true" ]; then
                  guard merge_or_update "$pr" "$head" "$base" "$held"
                else
                  echo "$pr $head $mbase $held" >> /tmp/cands
                fi
              done < /tmp/ready
              if [ "$block" = "true" ]; then
                trains
                for t in $(jq -r '.[].name' /tmp/trains.json); do
                  echo "$TRAIN_BASE requires up-to-date branches; removing $t"; delete_branch "$t"
                done
              else
                me="agent-${REPOSITORY#*/}"
                me_email="$me@$AGENT_DOMAIN"
                : > /tmp/cands.next
                while read -r pr head mbase held; do
                  if has_marker "$pr" "<!-- merge-train:failed $head -->"; then
                    echo "PR $pr failed a train on its own at $head; waiting for a new head"
                  else
                    echo "$pr $head $mbase $held" >> /tmp/cands.next
                  fi
                done < /tmp/cands
                mv /tmp/cands.next /tmp/cands
                train
              fi ;;
            *) die "unexpected event $EVENT" ;;
          esac
          exit "$failed"
