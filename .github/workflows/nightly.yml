# Nightly jobs: the long-horizon checks, kept off the push path.
#
# Jobs that verify a slow-moving property, or that were known-red with tracked
# issues, do NOT run per push — a known-red job burning 60-90 runner-minutes
# per push produces information we already have. They run here on
# workflow_dispatch, which the coordinator fires nightly (no cron trigger,
# #175), and are NOT in any merge gate. A job may
# move back to ci.yml once its reason for being here is gone; that move is
# deliberate, not automatic.
#
# Every step is a make target (#89, devops §4), exactly as in ci.yml: trivy's
# version, checksum and flags, and the .trivyignore
# wiring all live in the Makefile, so a nightly finding reproduces with the
# same `make` line locally. The jobs run on the bare runner with actions/setup-go,
# and get their pinned tools as ci.yml does (see its header).

name: Nightly

on:
  workflow_dispatch:                  # the coordinator's nightly dispatch (#175)

# Read-only by default; only the Trivy job, which uploads SARIF on
# github.com, is granted security-events: write, at job level.
permissions:
  contents: read

env:
  # 0 on our runners: require the image's baked tools at the pins, install
  # nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  # The FIPS-strict unit run (`make test-fips`) moved to ci.yml in #154, so it
  # gates every PR.

  # trivy is baked into the toolchain image at the pin in scripts/tool-pins.sh
  # (the pinned release tarball, accepted only if it matches the SHA-256 pinned
  # there), as on every other job. This replaced
  # `curl …/contrib/install.sh from main | sh` — an unreviewed script from a
  # moving branch, executed as the build user — and the trivy-action steps
  # that ran on github.com, a third-party action the CLI makes unnecessary.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the Trivy SARIF upload on github.com; unused on Gitea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Misconfiguration scanning, ADVISORY: findings surface daily without a
      # new finding class blocking anything (owner direction: enable it).
      # Promote it to a gate once its baseline is clean.
      - name: Trivy misconfiguration scan (advisory)
        run: make trivy-misconfig

      # Code scanning on github.com only: Gitea has no code-scanning API.
      - name: Trivy SARIF (github.com)
        if: github.server_url == 'https://github.com'
        run: make trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # The gate: vulnerabilities and secrets, CRITICAL/HIGH fail the job.
      # Nightly and advisory to merges in the alpha phase (devops §8a);
      # release.yml runs the same target as a blocking gate on every tag.
      - name: Trivy gate (CRITICAL/HIGH)
        run: make trivy
