# Nightly jobs: the long-horizon checks, kept off the push path.
#
# Jobs that verify a slow-moving property, or that were known-red with tracked
# issues, do NOT run per push — a known-red job burning 60-90 runner-minutes
# per push produces information we already have. They run here nightly, plus
# on demand via workflow_dispatch, and are NOT in any merge gate. A job may
# move back to ci.yml once its reason for being here is gone; that move is
# deliberate, not automatic.
#
# Every step is a make target (#89, devops §4), exactly as in ci.yml: the FIPS
# environment, trivy's version, checksum and flags, and the .trivyignore
# wiring all live in the Makefile, so a nightly finding reproduces with the
# same `make` line locally.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Read-only by default; only the Trivy job, which uploads SARIF on
# github.com, is granted security-events: write, at job level.
permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"   # MUST equal ci.yml's GO_VERSION (devops.md §9: one toolchain, adopted in one pass)

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # GOFIPS140=latest + GODEBUG=fips140=only (STRICT, not `on`), set by the
      # target itself; the Makefile records why `on` is a gate that cannot
      # fail on the thing it exists to catch. The target covers the same
      # packages as `make test`, but it is NOT the same run with only the FIPS
      # env added: it runs once, without -race and without the -cpu=1,2,8
      # matrix. It exists to find non-approved cryptography on a tested path,
      # which neither the race detector nor the CPU matrix bears on; the race
      # and contention defects stay with `make test`/`make coverage` in ci.yml.
      # If it fails, that failure IS the finding:
      # something on a tested path uses non-approved cryptography. Do not
      # weaken it to make it pass — fix the call site, or document a
      # deliberate exemption with the owner's approval.
      - name: Build and unit tests (FIPS 140-3 strict)
        run: make test-fips

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the Trivy SARIF upload on github.com; unused on Gitea
    env:
      # trivy is NOT baked into the runner image, so this job installs it on
      # both hosts: the pinned release tarball, accepted only if it matches the
      # SHA-256 pinned in the Makefile. This replaced
      # `curl …/contrib/install.sh from main | sh` — an unreviewed script from a
      # moving branch, executed as the build user — and the trivy-action steps
      # that ran on github.com, a third-party action the CLI makes unnecessary.
      TOOL_INSTALL: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Misconfiguration scanning, ADVISORY: findings surface daily without a
      # new finding class blocking anything (owner direction: enable it).
      # Promote it to a gate once its baseline is clean.
      - name: Trivy misconfiguration scan (advisory)
        run: make trivy-misconfig

      # Code scanning on github.com only: Gitea has no code-scanning API.
      - name: Trivy SARIF (github.com)
        if: github.server_url == 'https://github.com'
        run: make trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # The gate: vulnerabilities and secrets, CRITICAL/HIGH fail the job.
      # Nightly and advisory to merges in the alpha phase (devops §8a);
      # release.yml runs the same target as a blocking gate on every tag.
      - name: Trivy gate (CRITICAL/HIGH)
        run: make trivy
