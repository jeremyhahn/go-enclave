# Slow-moving and advisory checks, nightly and on dispatch, outside every merge gate; each step is a make target.

name: Nightly

on:
  workflow_dispatch:                  # the manual trigger
  schedule:
    - cron: '25 5 * * *'

# Read-only by default; only the Trivy job gets security-events: write.
permissions:
  contents: read

env:
  # 0 on our runners: require the image's baked tools at the pins, install
  # nothing. 1 on github.com, which has no baked image.
  TOOL_INSTALL: ${{ github.server_url == 'https://github.com' && '1' || '0' }}

jobs:
  # trivy is baked into the toolchain image at the pin in scripts/tool-pins.sh
  # lint-sweeps runs the repository's slow lint passes, off every push and PR path.
  lint-sweeps:
    name: Lint sweeps [toolchain image]
    runs-on: ubuntu-latest    # every job takes the hosted runner
    timeout-minutes: 131      # ceil(1.5 x this job's p95)
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: main
      CI_IMAGE_NAMESPACE: agent-ci-images  # lab-string-ok: registry namespace name, no host or address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Does the Makefile define lint-sweeps?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-sweeps[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-sweeps target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      # A GitHub-hosted runner has about 14 GB free; the image build needs more.
      - name: Free disk for the image build
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull the toolchain image from the registry cache
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          make docker-build-toolchain GO_BUILD_PROXY="${GOPROXY:-}"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # -k: a sweep reports every finding in one run; it gates no merge.
      - name: make lint-sweeps
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # bridge when a sweep needs the module proxy
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-sweeps"

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # the Trivy SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Misconfiguration scan, advisory until its baseline is clean.
      - name: Trivy misconfiguration scan (advisory)
        run: make trivy-misconfig

      # Code scanning upload on github.com only.
      - name: Trivy SARIF (github.com)
        if: github.server_url == 'https://github.com'
        run: make trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # No trivy gate here: ci.yml's make security and release.yml run it.
