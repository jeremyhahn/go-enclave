    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # ONE declaration of the trivy version, shared by both paths below and by
      # the Makefile, so the scanner in CI and the scanner on a developer's
      # machine are the same build. Bump .trivy-version, nothing else.
      - name: Resolve pinned trivy version
        id: trivy_version
        # Read as ONE bare token and FAIL if the file is malformed, matching the
        # Makefile's parser and install-trivy.sh. The old `tr -d ' \t\n\r'`
        # scrubbed all whitespace, so `0.74 .0` normalised to `0.74.0` and fed
        # the trivy-action `version:` inputs a version nobody pinned — CI would
        # not catch what `make install-tools` now refuses (go-blockstore #22).
        run: |
          version=$(awk '{for(i=1;i<=NF;i++){n++;v=$i}} END{if(n==1)print v}' .trivy-version)
          if [ -z "$version" ]; then
            echo "::error::.trivy-version is malformed (empty, whitespace, or multiple tokens); refusing to resolve a scrubbed version"
            exit 1
          fi
