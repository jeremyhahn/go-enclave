# Nightly jobs: the known-red and long-horizon checks, kept off the push path.
#
# Jobs that
# are known-red with tracked issues, or that verify a slow-moving property,
# do NOT run per push — a known-red job burning 60-90 runner-minutes per push
# produces information we already have. They run here nightly, plus on demand
# via workflow_dispatch, and are NOT in any merge gate. When their tracked
# issues land (FIPS: the repo's fips140=only issues; Trivy: the install/log
# diagnosis), a job may move back to ci.yml — that move is deliberate, not
# automatic.
#
# the fips job needs this repo's build deps; trivy needs
# the repo's .trivyignore and skip-dirs. Both jobs are copied verbatim from
# ci.yml (they are unchanged by the move).

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  GO_VERSION: "1.26.7"   # track ci.yml

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      # STRICT mode, not `on`.
      #
      # `fips140=on` loads the Go Cryptographic Module but still PERMITS
      # non-approved algorithms: code or a test exercising MD5 or SHA-1
      # succeeds, so this job — and the required CI gate above it — reports
      # green while a regulated path uses prohibited cryptography. A gate that
      # cannot fail on the thing it exists to catch is decoration.
      #
      # `fips140=only` makes non-approved operations error or panic, which is
      # what a compliance gate for FedRAMP / PCI DSS / HIPAA has to do.
      #
      # Measured before adopting, not assumed: libraries using ristretto255,
      # secp256k1 and edwards25519 pass under `only`, and a build is unaffected
      # either way — GODEBUG is a RUNTIME setting and cannot cause compile
      # errors.
      #
      # If this job now fails in a repo, that failure IS the finding: something
      # on a tested path is using non-approved cryptography. Do not weaken this
      # back to `on` to make it pass — fix the call site, or document a
      # deliberate exemption with the owner's approval.
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        run: go build ./...

      # this MUST mirror the repo's own unit-test
      # invocation — same build tags, same package scope, same dark-suite
      # exclusions — with ONLY the FIPS env changed. A bare `go test ./...`
      # drags in tag-gated helpers, environment-dependent integration
      # suites, and deliberately-dark timing tests that the Test job
      # excludes, and fails for reasons that have nothing to do with FIPS
      # and fails for reasons that have nothing to do with FIPS.
      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s ./...


  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # skip-dirs — benchmark harnesses, examples, vendored
      # adapters; nothing that ships in a release may be skipped.
      - name: Trivy scan (SARIF for code scanning)
        # trivy-action's setup checks out aquasecurity/trivy from github.com
        # with the runner token, which a Gitea token cannot authenticate.
        if: github.server_url == 'https://github.com'
        # PINNED TO A RELEASE TAG, AND THAT IS NOT WHERE `@master` POINTED.
        #
        # Both trivy-action steps in this job used to say `@master`. A branch is
        # worse than a movable tag: it is re-resolved on every nightly, so this
        # job ran whatever upstream merged that day, against a write-scoped
        # token that uploads SARIF. Nobody reviewed those changes and no commit
        # here recorded them.
        #
        # `master` has no version to preserve, so pinning it had to CHOOSE a
        # commit, and the choice is deliberate: v0.36.0, the latest release, not
        # master's head. They differ. A release tag is an artifact upstream
        # decided to cut, and it gives the trailing comment something a human
        # can read and bump against; master's head is whichever commit happened
        # to be last, and a bare sha with no version beside it is unbumpable.
        #
        # Re-pin by raising BOTH trivy steps to the next release together, and
        # take the `^{}` PEELED sha -- these tags are annotated, so the
        # unpeeled sha is the tag object and fails at checkout.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        # Same release as the SARIF step above, deliberately -- the scan and the
        # gate must see identical scanner behaviour, or the gate passes on a
        # finding the uploaded SARIF reported. Bump the two together. See the
        # note on that step for why this is a release tag and not master.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples
          trivyignores: .trivyignore

      # Same gate on Gitea, via the trivy CLI installed from the release
      # tarball (anonymous download — no github.com auth involved).
      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table --skip-dirs test,examples --ignorefile .trivyignore .

      # Misconfiguration scanning, advisory exit code, so findings surface
      # daily without a new finding class blocking merges. Promote it to the
      # pull-request gate once its baseline is clean.
      - name: Trivy misconfiguration scan (advisory)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table --skip-dirs test,examples --ignorefile .trivyignore .

