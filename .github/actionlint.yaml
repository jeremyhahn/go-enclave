# actionlint-template: v7 — fleet self-hosted runner labels for actionlint.
# Self-hosted runner labels actionlint accepts; a workflow that adds a label adds it here in the same change.
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - codex
    - codex-task
    - claude
    - code-review
    - batch
    - bigdisk
    - ci-gate
    - qwen
    - dells
    - release
    - fixture-push
