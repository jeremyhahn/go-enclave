# actionlint configuration (`make lint-actions` picks it up from .github/).
self-hosted-runner:
  # Custom runner labels of our Gitea runners. ci-gate is the reserved label
  # the CI Gate runs on (see the header of workflows/ci.yml).
  labels:
    - ci-gate
    # The batch runners: dispatch-only work (workflows/batch.yml, handbook batch.yml).
    - batch
    # The Dell and omega runners: the Devcontainer image job (workflows/ci.yml, #225).
    - bigdisk
    # actionlint-template v6: the template ships every self-hosted label, so a
    # copy takes no per-project waiver. qwen is where code-review.yml's review
    # job runs; dells names the Dell runners a ci.yml may use.
    - qwen
    - dells
